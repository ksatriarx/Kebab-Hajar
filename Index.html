<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kebab Turki Hajar</title>
    <!-- Google Fonts untuk nuansa bold & premium -->
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Poppins:wght@400;600;700&family=Rye&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0a09;
            --card-bg: #14110f;
            --primary-red: #d32f2f;
            --flame-orange: #f57c00;
            --gold: #fbc02d;
            --text-light: #f5f5f4;
            --text-muted: #a8a29e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #24140e 0%, #0c0a09 100%);
            color: var(--text-light);
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            border: 3px solid #3a221d;
            border-radius: 12px;
            padding: 20px;
            background: linear-gradient(180deg, rgba(20,17,15,1) 0%, rgba(10,8,7,1) 100%);
            position: relative;
            box-shadow: 0 0 30px rgba(211, 47, 47, 0.2);
            overflow: hidden;
        }

        /* Aksen Api di Border */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--primary-red), var(--flame-orange), var(--primary-red));
        }

        /* Header UI (Mirip Poster) */
        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px dashed #3a221d;
            padding-bottom: 15px;
        }

        header .welcome {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        header h1 {
            font-family: 'Rye', cursive;
            font-size: 38px;
            color: var(--text-light);
            line-height: 1;
            margin: 5px 0;
            text-shadow: 2px 2px 0px #000;
        }

        header h2 {
            font-family: 'Metal Mania', cursive;
            font-size: 45px;
            color: var(--primary-red);
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #000, 0 0 10px rgba(211,47,47,0.6);
        }

        header .tagline {
            background: var(--gold);
            color: #000;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            display: inline-block;
            margin-top: 5px;
            transform: skewX(-10deg);
            text-transform: uppercase;
        }

        /* Menu List */
        .menu-item {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid #291e1b;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .menu-item:hover {
            border-color: var(--primary-red);
            box-shadow: 0 0 10px rgba(211,47,47,0.1);
        }

        .menu-img {
            width: 70px;
            height: 70px;
            background: #241c1a;
            border-radius: 50%;
            border: 2px solid var(--primary-red);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .menu-details {
            flex-grow: 1;
        }

        .menu-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: #fff;
        }

        .menu-title span {
            color: var(--primary-red);
            display: block;
            font-size: 16px;
        }

        .menu-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 3px;
            line-height: 1.3;
        }

        .menu-price-action {
            text-align: right;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .price {
            font-size: 16px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 8px;
        }

        /* Counter Kuantitas */
        .counter {
            display: flex;
            align-items: center;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #3a221d;
        }

        .counter button {
            background: none;
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .counter button:hover {
            background: var(--primary-red);
        }

        .counter span {
            width: 25px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
        }

        /* Form Input Data & Lokasi */
        .form-group {
            margin-top: 25px;
            background: #14110f;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #291e1b;
        }

        .input-box {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: #0c0a09;
            border: 1px solid #3a221d;
            border-radius: 6px;
            padding: 10px 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary-red);
        }

        .location-btn {
            width: 100%;
            background: #24140e;
            border: 1px dashed var(--primary-red);
            color: #ff9e9e;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .location-btn:hover {
            background: #36170d;
            color: #fff;
        }

        .location-status {
            font-size: 11px;
            color: var(--gold);
            margin-top: 6px;
            text-align: center;
            display: none;
        }

        /* Ringkasan Pembayaran & Tombol Order */
        .order-summary-box {
            margin-top: 20px;
            border-top: 2px dashed #3a221d;
            padding-top: 15px;
        }

        .total-pay {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 700;
        }

        .total-pay .amount {
            color: var(--gold);
            font-size: 22px;
        }

        .btn-checkout {
            width: 100%;
            background: linear-gradient(135deg, #b71c1c 0%, #d32f2f 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(211, 47, 47, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-checkout:hover {
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.6);
        }

        .btn-checkout:active {
            transform: scale(0.98);
        }

        /* Footer Logo Brand */
        footer {
            text-align: center;
            margin-top: 30px;
        }
        .footer-brand {
            font-family: 'Rye', cursive;
            font-size: 32px;
            color: var(--gold);
            line-height: 1;
        }
        .footer-sub {
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--primary-red);
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="welcome">Welcome To</div>
        <h1>KEBAB</h1>
        <h2>TURKI</h2>
        <div class="tagline">Lezatnya Daging Pilihan</div>
    </header>

    <!-- List Menu Dinamis -->
    <div id="menu-container"></div>

    <!-- Data Pembeli & Fitur Shareloc -->
    <div class="form-group">
        <div class="input-box">
            <label for="buyer-name">Nama Pembeli</label>
            <input type="text" id="buyer-name" placeholder="Masukkan nama Anda..." required>
        </div>
        
        <div class="input-box">
            <label for="order-notes">Catatan Tambahan</label>
            <textarea id="order-notes" rows="2" placeholder="Contoh: Pedas sekali, tidak pakai sayur, dll."></textarea>
        </div>

        <div class="input-box" style="margin-bottom: 0;">
            <label>Lokasi Pengiriman (Otomatis GPS)</label>
            <button type="button" class="location-btn" onclick="getLocation()">
                📍 Klik untuk Bagikan Shareloc (GPS)
            </button>
            <div id="location-status" class="location-status">✔ Lokasi berhasil dikunci!</div>
        </div>
    </div>

    <!-- Ringkasan Pembayaran & Tombol Order -->
    <div class="order-summary-box">
        <div class="total-pay">
            <span>Total Bayar:</span>
            <span class="amount" id="total-amount">Rp 0</span>
        </div>
        <button class="btn-checkout" onclick="sendWhatsApp()">🔥 PESAN SEKARANG VIA WA</button>
    </div>

    <footer>
        <div class="footer-brand">Hajar</div>
        <div class="footer-sub">Kebab Turki - Fresh & Lezat</div>
    </footer>
</div>

<script>
    // Konfigurasi Nomor WA dan Data Menu Sesuai Poster
    const WHATSAPP_NUMBER = "6282299893251"; 
    
    const menuData = [
        { id: 1, type: "KEBAB", name: "Telur Sosis", price: 10000, desc: "Daging juicy, telur, sosis, sayuran segar, dan saus spesial.", emoji: "🌯" },
        { id: 2, type: "KEBAB", name: "Daging", price: 10000, desc: "Daging juicy, sayuran segar, dan saus spesial.", emoji: "🌯" },
        { id: 3, type: "KEBAB", name: "Daging Sosis", price: 13000, desc: "Daging juicy, sosis, sayuran segar, dan saus spesial.", emoji: "🌯" },
        { id: 4, type: "KEBAB", name: "Daging Telur", price: 13000, desc: "Daging juicy, telur, sayuran segar, dan saus spesial.", emoji: "🌯" },
        { id: 5, type: "KEBAB", name: "Daging Telur Sosis", price: 15000, desc: "Daging juicy, telur, sosis, dan saus spesial.", emoji: "🌯" },
        { id: 6, type: "KEBAB", name: "Daging Telur Sosis Keju", price: 18000, desc: "Daging juicy, telur, sosis, keju, sayuran segar, dan saus spesial.", emoji: "🌯" }
    ];

    let cart = {};
    let userLocation = "";

    // Render Menu ke UI
    function renderMenu() {
        const container = document.getElementById('menu-container');
        container.innerHTML = menuData.map(item => `
            <div class="menu-item">
                <div class="menu-img">${item.emoji}</div>
                <div class="menu-details">
                    <div class="menu-title">${item.type} <span>${item.name}</span></div>
                    <div class="menu-desc">${item.desc}</div>
                </div>
                <div class="menu-price-action">
                    <div class="price">${item.price.toLocaleString('id-ID')},-</div>
                    <div class="counter">
                        <button onclick="updateQty(${item.id}, -1)">-</button>
                        <span id="qty-${item.id}">0</span>
                        <button onclick="updateQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // Update Kuantitas Item
    function updateQty(id, change) {
        if (!cart[id]) cart[id] = 0;
        cart[id] += change;
        if (cart[id] < 0) cart[id] = 0;
        
        document.getElementById(`qty-${id}`).innerText = cart[id];
        calculateTotal();
    }

    // Hitung Total Belanja
    function calculateTotal() {
        let total = 0;
        menuData.forEach(item => {
            const qty = cart[item.id] || 0;
            total += qty * item.price;
        });
        document.getElementById('total-amount').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    // Ambil Koordinat GPS Otomatis (Shareloc)
    function getLocation() {
        const statusText = document.getElementById('location-status');
        if (navigator.geolocation) {
            statusText.style.display = "block";
            statusText.innerText = "⏳ Sedang mengunci lokasi...";
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    userLocation = `https://maps.google.com/?q=${lat},${lon}`;
                    statusText.innerText = "✔ Lokasi GPS Berhasil Terkunci!";
                    statusText.style.color = "#4caf50";
                },
                (error) => {
                    statusText.innerText = "❌ Gagal memuat lokasi. Pastikan GPS aktif.";
                    statusText.style.color = "#d32f2f";
                }
            );
        } else {
            statusText.innerText = "Browser tidak mendukung GPS.";
        }
    }

    // Kirim Format Pesanan Ke WhatsApp
    function sendWhatsApp() {
        const buyerName = document.getElementById('buyer-name').value.trim();
        const orderNotes = document.getElementById('order-notes').value.trim();

        if (!buyerName) {
            alert("Silakan masukkan Nama Anda terlebih dahulu!");
            return;
        }

        let hasItems = false;
        let orderText = `*PESANAN KEBAB TURKI HAJAR*\n`;
        orderText += `---------------------------------------\n`;
        orderText += `👤 *Nama Pembeli:* ${buyerName}\n`;
        orderText += `---------------------------------------\n`;
        
        menuData.forEach(item => {
            const qty = cart[item.id] || 0;
            if (qty > 0) {
                orderText += `▪ ${item.type} ${item.name} (${qty}x) : Rp ${(item.price * qty).toLocaleString('id-ID')}\n`;
                hasItems = true;
            }
        });

        if (!hasItems) {
            alert("Silakan pilih minimal 1 kebab terlebih dahulu!");
            return;
        }

        orderText += `---------------------------------------\n`;
        orderText += `*Total Bayar:* ${document.getElementById('total-amount').innerText}\n`;
        
        if (orderNotes) {
            orderText += `📝 *Catatan:* ${orderNotes}\n`;
        }
        
        orderText += `---------------------------------------\n`;
        if (userLocation) {
            orderText += `📍 *Link Shareloc Tujuan:* ${userLocation}\n`;
        } else {
            orderText += `📍 *Link Shareloc Tujuan:* (Pelanggan belum klik tombol shareloc)\n`;
        }

        const encodedText = encodeURIComponent(orderText);
        window.open(`https://api.whatsapp.com/send?phone=${WHATSAPP_NUMBER}&text=${encodedText}`, '_blank');
    }

    // Jalankan fungsi saat web dibuka
    renderMenu();
</script>

</body>
</html>
