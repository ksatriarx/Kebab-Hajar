<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kebab IDI - POS Kasir & Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #050505; --bg-card: #121212; --bg-card-hover: #1e1e1e;
            --text-main: #ffffff; --text-muted: #888888;
            --primary: #e53935; --accent: #ffb300;
            --success: #10b981; --border: #2a2a2a;
            --radius-md: 12px; --radius-lg: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; height: 100vh; height: 100dvh; overflow: hidden; }
        .access-denied { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; text-align: center; background: var(--bg-main); }
        .access-denied h1 { font-size: 28px; color: var(--primary); margin-bottom: 10px; }
        .btn-back { background: var(--primary); color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; margin-top: 15px; }
        .pos-container { display: none; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; background: var(--bg-main); flex-direction: column; position: relative; }
        .pos-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); z-index: 10; flex-shrink: 0; }
        .header-brand { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; font-style: italic; color: var(--primary); }
        .header-brand span { color: white; font-style: normal; }
        .header-info { font-size: 9px; color: var(--text-muted); text-align: right; margin-bottom: 4px; }
        .header-actions { display: flex; gap: 6px; align-items: center; }
        .btn-icon { background: rgba(255, 255, 255, 0.1); color: var(--text-main); border: 1px solid var(--border); width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: 0.2s; }
        .btn-icon-admin { display: none; }
        .btn-install-pwa { display: none; background: rgba(255, 179, 0, 0.2); border-color: var(--accent); color: var(--accent); animation: pulse-install 2s infinite; }
        @keyframes pulse-install { 0% { box-shadow: 0 0 0 0 rgba(255, 179, 0, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(255, 179, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 179, 0, 0); } }
        
        .btn-logout { background: rgba(229, 57, 53, 0.1); color: var(--primary); border: 1px solid var(--primary); padding: 0 12px; height: 32px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 10px; transition: 0.2s; }
        
        .tabs { display: flex; padding: 10px 15px 0 15px; gap: 10px; border-bottom: 1px solid var(--border); background: var(--bg-main); flex-shrink: 0; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-muted); font-size: 12px; font-weight: 700; cursor: pointer; position: relative; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 6px; white-space: nowrap; }
        .tab-btn.active { color: var(--primary); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 3px; background: var(--primary); border-radius: 3px 3px 0 0; box-shadow: 0 -2px 10px rgba(229, 57, 53, 0.5); }
        .badge-notif { background: var(--accent); color: #000; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 10px; display: none; animation: pulse 2s infinite; }
        .badge-notif.show { display: inline-block; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        .content-area { flex-grow: 1; overflow-y: auto; display: none; position: relative; }
        .content-area.active { display: block; }

        .order-list { padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .order-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 12px; border: 1px solid var(--border); position: relative; overflow: hidden; }
        .order-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--accent); }
        .oc-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 9px; color: var(--text-muted); }
        .order-badge { background: var(--primary); color: white; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
        .oc-name { font-size: 14px; font-weight: 800; color: white; margin-bottom: 2px; }
        .oc-email { font-size: 10px; color: var(--accent); margin-bottom: 6px; }
        .oc-detail { font-size: 10px; line-height: 1.5; color: #bbb; margin-bottom: 10px; background: var(--bg-main); padding: 8px; border-radius: 6px; white-space: pre-wrap; }
        .oc-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border); padding-top: 10px; }
        .oc-total { font-size: 13px; font-weight: 800; color: white; }
        .oc-actions { display: flex; gap: 6px; }
        .btn-action { border: none; padding: 6px 10px; border-radius: 6px; font-size: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .btn-proses { background: rgba(255, 179, 0, 0.2); color: var(--accent); border: 1px solid var(--accent); }
        .btn-selesai { background: var(--success); color: white; }
        .btn-batal { background: rgba(229, 57, 53, 0.2); color: var(--primary); border: 1px solid var(--primary); }

        .pos-layout { display: flex; flex-direction: column; height: 100%; }
        .menu-section { flex-grow: 1; padding: 10px; overflow-y: auto; }
        .category-scroll { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 10px; font-weight: 700; white-space: nowrap; cursor: pointer; }
        .cat-btn.active { background: rgba(229, 57, 53, 0.1); border-color: var(--primary); color: var(--primary); }
        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .pos-card { background: var(--bg-card); border-radius: 8px; padding: 5px; border: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; }
        .pos-img { width: 100%; aspect-ratio: 1/1; border-radius: 6px; object-fit: cover; margin-bottom: 4px; }
        .pos-info { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .pos-title { font-size: 9px; font-weight: 700; line-height: 1.2; margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 22px; }
        .pos-price { font-size: 9px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
        .pos-bottom { margin-top: auto; }
        .pos-add { background: var(--primary); color: white; border: none; width: 100%; height: 28px; border-radius: 4px; font-size: 9px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .pos-add:disabled { background: #ffb300; color: #000; cursor: not-allowed; font-weight: bold; }
        .qty-control { display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); border: 1px solid var(--border); height: 28px; border-radius: 4px; padding: 0 2px; }
        .qty-control button { background: transparent; border: none; color: white; font-size: 12px; font-weight: 800; cursor: pointer; width: 24px; height: 100%; display: flex; justify-content: center; align-items: center; }
        .qty-control span { font-size: 10px; font-weight: 800; }

        .cart-section { background: var(--bg-card); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; padding: 10px 15px; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; max-height: 45vh; flex-shrink: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .cart-title-text { font-size: 12px; font-weight: 800; color: white; }
        .cart-list-pos { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; border-bottom: 1px dashed var(--border); padding-bottom: 6px; }
        .cart-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 11px; }
        .cart-row-name { font-weight: 700; color: white; }
        .cart-row-price { color: var(--accent); font-size: 10px; }
        .cart-total-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .cart-total-text { font-size: 11px; color: var(--text-muted); }
        .cart-total-val { font-size: 18px; font-weight: 800; color: var(--primary); }
        .btn-checkout { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 800; cursor: pointer; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 10px; }
        .modal-box { background: var(--bg-card); border-radius: 16px; width: 100%; max-width: 380px; padding: 15px; border: 1px solid var(--border); height: 90dvh; max-height: 800px; display: flex; flex-direction: column; overflow: hidden; }
        .modal-title { font-size: 14px; font-weight: 800; text-align: center; margin-bottom: 10px; flex-shrink: 0; }
        .pay-methods { display: flex; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
        .pay-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: white; font-weight: 700; font-size: 10px; cursor: pointer; }
        .pay-btn.active { border-color: var(--primary); background: rgba(229, 57, 53, 0.1); color: var(--primary); }
        .form-group { margin-bottom: 8px; flex-shrink: 0; }
        .form-label { display: block; font-size: 9px; color: var(--text-muted); margin-bottom: 2px; }
        .form-input { width: 100%; padding: 8px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 16px; font-weight: 800; text-align: right; outline: none; }
        .change-box { background: var(--bg-main); padding: 8px; border-radius: 8px; margin-bottom: 10px; border: 1px dashed var(--border); flex-shrink: 0; }
        .change-row { display: flex; justify-content: space-between; font-size: 10px; margin-bottom: 4px; color: var(--text-muted); }
        .change-val { color: var(--accent); font-size: 14px; font-weight: 800; }
        .modal-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .btn-cancel { flex: 1; padding: 10px; border-radius: 8px; border: none; background: #333; color: white; font-weight: 700; font-size: 11px; cursor: pointer; }
        .btn-confirm { flex: 2; padding: 10px; border-radius: 8px; border: none; background: var(--success); color: white; font-weight: 700; font-size: 11px; cursor: pointer; }
        #custom-keypad-area { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
        .custom-keypad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 5px; height: 100%; width: 100%; }
        .custom-keypad button { border-radius: 6px; border: 1px solid var(--border); background: var(--bg-main); color: white; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; padding: 0; transition: 0.1s; }
        .custom-keypad button:active { background: var(--bg-card-hover); }
        .custom-keypad .btn-clear { color: var(--primary); }
        .custom-keypad .btn-del { color: var(--accent); }
        .empty-state { text-align: center; padding: 30px 20px; color: var(--text-muted); font-size: 11px; }
        .empty-state i { font-size: 30px; opacity: 0.3; margin-bottom: 8px; display: block; }

        @media (orientation: landscape) and (max-height: 500px) {
            .pos-container { max-width: 100vw; } .pos-header { display: none; } .tabs { position: absolute; top: 0; left: 0; width: 100%; background: var(--bg-main); z-index: 5; padding: 0 15px; height: 40px; }
            .content-area.active { display: flex; width: 100%; height: 100vh; height: 100dvh; padding-top: 40px; } .pos-layout { display: flex; flex-direction: row; width: 100%; height: 100%; margin: 0; }
            .menu-section { flex: 1; height: 100%; border-right: 1px solid var(--border); padding: 15px; overflow-y: auto; } .menu-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
            .cart-section { width: 35%; min-width: 280px; max-width: 350px; height: 100%; max-height: none; margin-left: auto; border-radius: 0; border-top: none; border-left: 1px solid var(--border); box-shadow: none; padding: 15px; }
            .cart-list-pos { flex-grow: 1; height: auto; } .btn-checkout { margin-top: auto; } .online-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; width: 100%; padding: 15px; }
            .modal-box { max-width: 650px; height: 95dvh; max-height: 95dvh; padding: 8px 12px; } .modal-title { display: none; } .pay-methods { margin-bottom: 4px; gap: 4px; } .pay-btn { padding: 4px; font-size: 9px; }
            .form-group { margin-bottom: 4px; } .form-label { margin-bottom: 1px; font-size: 8px; } .form-input { padding: 4px; font-size: 14px; } .change-box { padding: 4px; margin-bottom: 4px; } .change-row { font-size: 9px; margin-bottom: 2px; } .change-val { font-size: 12px; }
            .modal-actions { gap: 4px; } .btn-cancel, .btn-confirm { padding: 6px; font-size: 10px; } .custom-keypad { gap: 3px; } .custom-keypad button { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="access-denied" id="access-denied">
        <i class="fa-solid fa-lock" style="font-size: 50px; color: var(--primary); margin-bottom: 20px;"></i>
        <h1>Akses Ditolak</h1>
        <p style="font-size: 13px;">Halaman ini hanya untuk Akun Kasir resmi Kebab IDI.</p>
        <a href="index.html" class="btn-back">Kembali ke Beranda</a>
    </div>

    <div class="pos-container" id="pos-app">
        <div class="pos-header">
            <div class="header-brand"><i class="fa-solid fa-utensils"></i> <span>Kebab</span>Hajar</div>
            <div style="text-align: right;">
                <div class="header-info" id="header-email">-</div>
                <div class="header-actions">
                    <button class="btn-icon btn-install-pwa" id="btn-install-pwa" onclick="picuInstall()" title="Install Aplikasi Kasir"><i class="fa-solid fa-download"></i></button>
                    <button class="btn-icon" onclick="toggleFullscreen()" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
                    <a href="pengaturan-toko.html" id="btn-settings-admin" class="btn-icon btn-icon-admin" title="Buka Pengaturan Toko"><i class="fa-solid fa-gear"></i></a>
                    <button class="btn-logout" onclick="prosesLogout()">Tutup</button>
                </div>
            </div>
        </div>

        <div class="tabs">
            <button id="tab-btn-online" class="tab-btn active" onclick="switchTab('online')">Web <span id="badge-online" class="badge-notif">0</span></button>
            <button id="tab-btn-self" class="tab-btn" onclick="switchTab('self')">Self Service <span id="badge-self" class="badge-notif">0</span></button>
            <button id="tab-btn-offline" class="tab-btn" onclick="switchTab('offline')">Kasir Offline</button>
        </div>

        <div id="area-online" class="content-area active">
            <div class="order-list" id="online-orders-list">
                <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i>Memuat pesanan...</div>
            </div>
        </div>

        <div id="area-self" class="content-area">
            <div class="order-list" id="self-orders-list">
                <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i>Memuat pesanan...</div>
            </div>
        </div>

        <div id="area-offline" class="content-area">
            <div class="pos-layout">
                <div class="menu-section">
                    <div class="category-scroll">
                        <button class="cat-btn active" id="cat-makanan" onclick="switchCategory('makanan')">Makanan</button>
                        <button class="cat-btn" id="cat-minuman" onclick="switchCategory('minuman')">Minuman</button>
                    </div>
                    <div class="menu-grid" id="pos-menu-grid"></div>
                </div>

                <div class="cart-section">
                    <div class="cart-header">
                        <span class="cart-title-text">Keranjang Kasir</span>
                        <button onclick="resetCart()" style="background:none; border:none; color:var(--text-muted); font-size:9px; cursor:pointer;"><i class="fa-solid fa-trash"></i> Reset</button>
                    </div>
                    <div class="cart-list-pos" id="pos-cart-list">
                        <div class="empty-state" style="padding: 10px;">Belum ada item.</div>
                    </div>
                    <div class="cart-total-bar">
                        <span class="cart-total-text">Total:</span>
                        <span class="cart-total-val" id="pos-total">Rp 0</span>
                    </div>
                    <button class="btn-checkout" onclick="bukaPembayaran()">Bayar Sekarang</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="payment-modal">
        <div class="modal-box">
            <div class="modal-title">Pilih Pembayaran</div>
            <div class="pay-methods">
                <button class="pay-btn active" id="btn-cash" onclick="pilihMetode('cash')">💵 Tunai</button>
                <button class="pay-btn" id="btn-qris" onclick="pilihMetode('qris')">📱 QRIS</button>
            </div>

            <div id="area-cash">
                <div class="form-group">
                    <label class="form-label">Uang Diterima (Rp)</label>
                    <input type="text" id="uang-diterima" class="form-input" placeholder="0" readonly>
                </div>
            </div>

            <div id="area-qris" style="display: none; text-align: center; margin-bottom: 10px;">
                <div style="background: white; padding: 8px; border-radius: 8px; display: inline-block;">
                    <i class="fa-solid fa-qrcode" style="font-size: 60px; color: black;"></i>
                </div>
            </div>

            <div id="custom-keypad-area">
                <div class="custom-keypad">
                    <button onclick="pressNum('1')">1</button><button onclick="pressNum('2')">2</button><button onclick="pressNum('3')">3</button>
                    <button onclick="pressNum('4')">4</button><button onclick="pressNum('5')">5</button><button onclick="pressNum('6')">6</button>
                    <button onclick="pressNum('7')">7</button><button onclick="pressNum('8')">8</button><button onclick="pressNum('9')">9</button>
                    <button class="btn-clear" onclick="clearNum()">C</button><button onclick="pressNum('0')">0</button><button class="btn-del" onclick="deleteNum()"><i class="fa-solid fa-delete-left"></i></button>
                </div>
            </div>

            <div class="change-box">
                <div class="change-row"><span>Total Tagihan:</span><span id="modal-total">Rp 0</span></div>
                <div class="change-row" style="margin-top: 4px; border-top: 1px solid var(--border); padding-top: 4px;">
                    <span>Kembalian:</span><span id="modal-kembalian" class="change-val">Rp 0</span>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="tutupPembayaran()">Batal</button>
                <button class="btn-confirm" onclick="selesaikanPesanan()">✔ Simpan</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, updateDoc, where, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCceiYONY_sx9ivD0CDDQGoB9OXm05h4CY", authDomain: "kebab-idi.firebaseapp.com", projectId: "kebab-idi", storageBucket: "kebab-idi.firebasestorage.app", messagingSenderId: "303997052314", appId: "1:303997052314:web:1db122bc5911297b710623" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
        const ALLOWED_EMAIL = "rxstore101@gmail.com";
        let menuData = []; let cart = {}; let metodePembayaran = 'cash'; let currentCategory = 'makanan'; let unsubOnlineOrders = null; let unsubSelfOrders = null; let inputUangString = ""; 
        let isFirstLoadOnline = true; let knownOrderIdsOnline = new Set(); let isFirstLoadSelf = true; let knownOrderIdsSelf = new Set(); let audioCtx = null;

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('btn-install-pwa').style.display = 'flex'; });
        window.picuInstall = () => {
            if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then((choiceResult) => { if (choiceResult.outcome === 'accepted') { console.log('User accepted install'); } deferredPrompt = null; }); } 
            else { alert("Untuk Install Aplikasi: Klik titik tiga (⋮) di pojok kanan atas Chrome, lalu pilih 'Install App' atau 'Tambahkan ke Layar Utama'."); }
        };

        window.toggleFullscreen = () => { if (!document.fullscreenElement) { if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(err => { console.log(`Gagal: ${err.message}`); }); } } else { if (document.exitFullscreen) { document.exitFullscreen(); } } };
        document.body.addEventListener('click', function unlockAudio() { if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });
        function playNotifSound() { if (!audioCtx) return; try { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } catch (e) { console.log("Audio error", e); } }

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ALLOWED_EMAIL) {
                document.getElementById('access-denied').style.display = 'none'; document.getElementById('pos-app').style.display = 'flex'; document.getElementById('header-email').innerText = user.email;
                if(user.email === ALLOWED_EMAIL) document.getElementById('btn-settings-admin').style.display = 'flex';
                loadMenuOffline(); listenOnlineOrders(); listenSelfServiceOrders();
            } else { document.getElementById('access-denied').style.display = 'flex'; document.getElementById('pos-app').style.display = 'none'; }
        });

        window.switchTab = (tab) => { 
            document.getElementById('area-online').classList.remove('active'); document.getElementById('area-offline').classList.remove('active'); document.getElementById('area-self').classList.remove('active'); 
            document.getElementById('tab-btn-online').classList.remove('active'); document.getElementById('tab-btn-offline').classList.remove('active'); document.getElementById('tab-btn-self').classList.remove('active'); 
            if(tab === 'online') { document.getElementById('area-online').classList.add('active'); document.getElementById('tab-btn-online').classList.add('active'); } 
            else if(tab === 'self') { document.getElementById('area-self').classList.add('active'); document.getElementById('tab-btn-self').classList.add('active'); }
            else { document.getElementById('area-offline').classList.add('active'); document.getElementById('tab-btn-offline').classList.add('active'); } 
        }

        function listenOnlineOrders() {
            const q = query(collection(db, "transaksi_online"), orderBy("waktu", "desc"));
            unsubOnlineOrders = onSnapshot(q, (snapshot) => {
                const list = document.getElementById('online-orders-list'); let html = ''; let countAktif = 0; let currentIds = new Set(); let newOrderArrived = false; let queueNumber = 1; 
                snapshot.forEach((doc) => {
                    const data = doc.data(); const docId = doc.id;
                    if (data.status !== 'Selesai' && data.status !== 'Dibatalkan') {
                        countAktif++; currentIds.add(docId); if (!knownOrderIdsOnline.has(docId) && !isFirstLoadOnline) newOrderArrived = true;
                        let tgl = data.waktu ? new Date(data.waktu).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' }) : '-';
                        const isProses = data.status === 'Sedang Dimasak' || data.status === 'Sedang Diantar' || data.status === 'Siap Diambil';
                        const borderColor = isProses ? 'var(--accent)' : 'var(--primary)';
                        html += `<div class="order-card" style="border-left-color: ${borderColor};"><div class="order-badge">Antrean #${queueNumber}</div><div class="oc-header"><span class="oc-id">${data.order_id}</span><span>${tgl}</span></div><div class="oc-name">${data.nama}</div><div class="oc-email"><i class="fa-solid fa-envelope"></i> ${data.email}</div><div class="oc-detail">${data.detail_pesanan}</div><div class="oc-footer"><div class="oc-total">Rp ${(data.total_bayar || 0).toLocaleString('id-ID')}</div><div class="oc-actions">${!isProses ? `<button class="btn-action btn-proses" onclick="updateStatusOnline('${docId}', 'Sedang Dimasak', '${data.email}')"><i class="fa-solid fa-fire"></i> Proses</button>` : `<span style="font-size:10px; color:var(--accent); font-weight:bold;">${data.status}</span>`}<button class="btn-action btn-selesai" onclick="updateStatusOnline('${docId}', 'Selesai', '${data.email}')"><i class="fa-solid fa-check"></i> Selesai</button></div></div></div>`;
                        queueNumber++; 
                    }
                });
                if (newOrderArrived) playNotifSound(); knownOrderIdsOnline = currentIds; isFirstLoadOnline = false;
                if (countAktif === 0) { list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-mug-hot"></i>Tidak ada pesanan web baru.</div>`; document.getElementById('badge-online').classList.remove('show'); } 
                else { list.innerHTML = html; const badge = document.getElementById('badge-online'); badge.innerText = countAktif; badge.classList.add('show'); }
            });
        }
        
        // FUNGSI NOTIFIKASI OTOMATIS
        async function kirimNotifKePelanggan(emailPembeli, statusBaru) {
            if (!emailPembeli || emailPembeli === 'Tamu (Tanpa Email)') return;
            try {
                const emailKey = emailPembeli.replace(/[^a-zA-Z0-9]/g, '');
                const custDoc = await getDoc(doc(db, "saldo_pelanggan", emailKey));
                if (custDoc.exists() && custDoc.data().fcm_token) {
                    let title = '', body = '';
                    if (statusBaru === 'Sedang Dimasak') { title = 'Pesanan Dimasak 🍳'; body = 'Kebab pesananmu sedang disiapkan ya kak!'; }
                    else if (statusBaru === 'Siap Diambil') { title = 'Pesanan Siap Diambil 🛍️'; body = 'Pesananmu sudah siap diambil di toko ya kak!'; }
                    else if (statusBaru === 'Sedang Diantar') { title = 'Pesanan Diantar 🛵'; body = 'Kurir kami sedang menuju ke lokasimu!'; }
                    else if (statusBaru === 'Selesai') { title = 'Pesanan Selesai ✅'; body = 'Terima kasih telah memesan di Kebab Hajar!'; }
                    if (title !== '') {
                        await fetch('https://kebab-backend.vercel.app/api/send-notif', {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ token: custDoc.data().fcm_token, title: title, body: body })
                        });
                    }
                }
            } catch (error) { console.log("Gagal kirim notif:", error); }
        }

        window.updateStatusOnline = async (docId, newStatus, email) => { 
            try { 
                await updateDoc(doc(db, "transaksi_online", docId), { status: newStatus }); 
                kirimNotifKePelanggan(email, newStatus);
            } catch (error) { alert("Gagal: " + error.message); } 
        }

        function listenSelfServiceOrders() {
            const q = query(collection(db, "transaksi_selfservice"), orderBy("waktu", "desc"));
            unsubSelfOrders = onSnapshot(q, (snapshot) => {
                const list = document.getElementById('self-orders-list'); let html = ''; let countAktif = 0; let currentIds = new Set(); let newOrderArrived = false;
                snapshot.forEach((doc) => {
                    const data = doc.data(); const docId = doc.id;
                    if (data.status !== 'Selesai' && data.status !== 'Dibatalkan') {
                        countAktif++; currentIds.add(docId); if (!knownOrderIdsSelf.has(docId) && !isFirstLoadSelf) newOrderArrived = true;
                        let tgl = data.waktu ? new Date(data.waktu).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' }) : '-';
                        const isLunasQRIS = data.status === 'Lunas (QRIS)'; const isMenungguKasir = data.status === 'Menunggu Pembayaran Kasir';
                        let borderColor = isMenungguKasir ? 'var(--primary)' : 'var(--success)';
                        let actionBtn = '';
                        if (isMenungguKasir) { actionBtn = `<button class="btn-action btn-batal" onclick="batalkanSelf('${docId}')"><i class="fa-solid fa-xmark"></i> Batal</button><button class="btn-action btn-proses" onclick="terimaPembayaranTunai('${docId}')"><i class="fa-solid fa-money-bill-wave"></i> Terima Tunai</button>`; } 
                        else if (data.status === 'Sedang Dimasak' || isLunasQRIS) { actionBtn = `<button class="btn-action btn-selesai" onclick="updateStatusSelf('${docId}', 'Selesai')"><i class="fa-solid fa-check"></i> Selesai</button>`; } 
                        else if (data.status === 'Menunggu Pembayaran QRIS') { actionBtn = `<button class="btn-action btn-batal" onclick="batalkanSelf('${docId}')"><i class="fa-solid fa-xmark"></i> Batal</button>`; }
                        let detailPesanan = data.rincian.map(i => `▪ ${i.nama} (${i.qty}x)`).join('<br>');
                        html += `<div class="order-card" style="border-left-color: ${borderColor};"><div class="order-badge" style="background: ${isMenungguKasir ? 'var(--primary)' : 'var(--success)'};">${data.queue_number}</div><div class="oc-header"><span class="oc-id">${tgl}</span><span style="font-weight:bold; color:${isMenungguKasir ? 'var(--primary)' : 'var(--success)'}">${data.status}</span></div><div class="oc-name">Metode: ${data.metode}</div><div class="oc-detail">${detailPesanan}</div><div class="oc-footer"><div class="oc-total">Rp ${data.total.toLocaleString('id-ID')}</div><div class="oc-actions">${actionBtn}</div></div></div>`;
                    }
                });
                if (newOrderArrived) playNotifSound(); knownOrderIdsSelf = currentIds; isFirstLoadSelf = false;
                if (countAktif === 0) { list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-mug-hot"></i>Tidak ada pesanan self service.</div>`; document.getElementById('badge-self').classList.remove('show'); } 
                else { list.innerHTML = html; const badge = document.getElementById('badge-self'); badge.innerText = countAktif; badge.classList.add('show'); }
            });
        }

        window.terimaPembayaranTunai = async (docId) => { if(confirm("Uang tunai sudah diterima?")) { try { await updateDoc(doc(db, "transaksi_selfservice", docId), { status: 'Sedang Dimasak' }); } catch (error) { alert("Gagal: " + error.message); } } }
        window.batalkanSelf = async (docId) => { if(confirm("Yakin ingin membatalkan pesanan ini?")) { try { await updateDoc(doc(db, "transaksi_selfservice", docId), { status: 'Dibatalkan' }); } catch (error) { alert("Gagal: " + error.message); } } }
        window.updateStatusSelf = async (docId, newStatus) => { try { await updateDoc(doc(db, "transaksi_selfservice", docId), { status: newStatus }); } catch (error) { alert("Gagal: " + error.message); } }

        function loadMenuOffline() { onSnapshot(collection(db, "menu_kebab"), (snapshot) => { menuData = []; snapshot.forEach((doc) => { const data = doc.data(); menuData.push(data); }); menuData.sort((a, b) => a.id - b.id); renderPosMenu(); }); }
        window.switchCategory = (cat) => { currentCategory = cat; document.getElementById('cat-makanan').classList.remove('active'); document.getElementById('cat-minuman').classList.remove('active'); document.getElementById(`cat-${cat}`).classList.add('active'); renderPosMenu(); }

        function renderPosMenu() {
            const grid = document.getElementById('pos-menu-grid'); const filtered = menuData.filter(item => item.category === currentCategory);
            if(filtered.length === 0) { grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); font-size:11px; padding:20px;">Belum ada menu.</div>`; return; }
            grid.innerHTML = filtered.map(item => {
                const qty = cart[item.id] || 0; const isPersiapan = item.status === 'persiapan'; let actionButton = '';
                if (isPersiapan) { actionButton = `<button class="pos-add" disabled>Persiapan</button>`; } 
                else { actionButton = qty === 0 ? `<button class="pos-add" onclick="addToCart(${item.id})">Tambah</button>` : `<div class="qty-control"><button onclick="updateQty(${item.id}, -1)">-</button><span>${qty}</span><button onclick="updateQty(${item.id}, 1)">+</button></div>`; }
                return `<div class="pos-card"><img src="${item.image}" class="pos-img" alt="${item.name}"><div class="pos-info"><div class="pos-title">${item.name}</div><div class="pos-price">Rp ${item.price.toLocaleString('id-ID')}</div><div class="pos-bottom">${actionButton}</div></div></div>`;
            }).join('');
        }

        window.addToCart = (id) => { updateQty(id, 1); }
        window.updateQty = (id, change) => { if(!cart[id]) cart[id] = 0; cart[id] += change; if(cart[id] < 0) cart[id] = 0; renderPosMenu(); renderPosCart(); }

        function renderPosCart() {
            const list = document.getElementById('pos-cart-list'); let html = '', total = 0, hasItems = false;
            Object.keys(cart).forEach(id => {
                if(cart[id] > 0) {
                    hasItems = true; const item = menuData.find(i => i.id === parseInt(id));
                    if(item) { total += item.price * cart[id]; html += `<div class="cart-row"><div><div class="cart-row-name">${item.name}</div><div class="cart-row-price">${cart[id]} x Rp ${item.price.toLocaleString('id-ID')}</div></div><div style="font-weight:800; font-size:11px;">Rp ${(item.price * cart[id]).toLocaleString('id-ID')}</div></div>`; }
                }
            });
            if(!hasItems) { list.innerHTML = `<div class="empty-state" style="padding: 10px;">Belum ada item.</div>`; } else { list.innerHTML = html; }
            document.getElementById('pos-total').innerText = `Rp ${total.toLocaleString('id-ID')}`; document.getElementById('modal-total').innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        window.resetCart = () => { if(confirm("Kosongkan keranjang?")) { cart = {}; renderPosMenu(); renderPosCart(); } }
        window.bukaPembayaran = () => { let total = 0; Object.keys(cart).forEach(id => { const item = menuData.find(i => i.id === parseInt(id)); if(item) total += item.price * cart[id]; }); if(total === 0) { alert("Pilih menu dulu!"); return; } document.getElementById('payment-modal').style.display = 'flex'; inputUangString = ""; document.getElementById('uang-diterima').value = ""; document.getElementById('modal-kembalian').innerText = "Rp 0"; pilihMetode('cash'); }
        window.tutupPembayaran = () => { document.getElementById('payment-modal').style.display = 'none'; }
        window.pilihMetode = (metode) => { metodePembayaran = metode; if(metode === 'cash') { document.getElementById('btn-cash').classList.add('active'); document.getElementById('btn-qris').classList.remove('active'); document.getElementById('area-cash').style.display = 'block'; document.getElementById('custom-keypad-area').style.display = 'flex'; document.getElementById('area-qris').style.display = 'none'; } else { document.getElementById('btn-qris').classList.add('active'); document.getElementById('btn-cash').classList.remove('active'); document.getElementById('area-cash').style.display = 'none'; document.getElementById('custom-keypad-area').style.display = 'none'; document.getElementById('area-qris').style.display = 'block'; } }
        window.pressNum = (num) => { if(inputUangString.length > 9) return; if(inputUangString === "0") inputUangString = ""; inputUangString += num; updateInputUang(); }
        window.deleteNum = () => { inputUangString = inputUangString.slice(0, -1); updateInputUang(); }
        window.clearNum = () => { inputUangString = ""; updateInputUang(); }
        function updateInputUang() { document.getElementById('uang-diterima').value = inputUangString; hitungKembalian(); }
        window.hitungKembalian = () => { let total = 0; Object.keys(cart).forEach(id => { const item = menuData.find(i => i.id === parseInt(id)); if(item) total += item.price * cart[id]; }); const diterima = parseInt(inputUangString) || 0; const kembalian = diterima - total; document.getElementById('modal-kembalian').innerText = kembalian > 0 ? `Rp ${kembalian.toLocaleString('id-ID')}` : 'Rp 0'; }

        window.selesaikanPesanan = async () => {
            let total = 0, rincian = [];
            Object.keys(cart).forEach(id => { const qty = cart[id]; if(qty > 0) { const item = menuData.find(i => i.id === parseInt(id)); if(item) { total += item.price * qty; rincian.push({ nama: item.name, qty: qty, harga: item.price, id: item.id }); } } });
            const diterima = parseInt(inputUangString) || 0;
            if(metodePembayaran === 'cash' && diterima < total) { alert("Uang diterima kurang!"); return; }
            try {
                await addDoc(collection(db, "transaksi_kasir"), { waktu: new Date().toISOString(), rincian: rincian, total: total, metode: metodePembayaran, uangDiterima: metodePembayaran === 'cash' ? diterima : total, kembalian: metodePembayaran === 'cash' ? (diterima - total) : 0, kasir: auth.currentUser.email });
                alert("✅ Transaksi Kasir Berhasil!");
                cart = {}; renderPosMenu(); renderPosCart(); tutupPembayaran();
            } catch (error) { alert("❌ Gagal: " + error.message); }
        }

        window.prosesLogout = () => { if(confirm("Tutup sesi kasir?")) { signOut(auth).then(() => window.location.href = 'index.html'); } }
    </script>
</body>
</html>
