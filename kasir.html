<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kebab IDI - Sistem Kasir</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #000000; --bg-card: #1a1a1a; --bg-input: #121212;
            --text-main: #ffffff; --text-muted: #888888;
            --primary: #e53935; --accent: #ffb300;
            --border: #333333; --success: #10b981;
            --radius-md: 12px; --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* --- LAYAR DIBLOKIR --- */
        .access-denied { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; text-align: center; background: var(--bg-main); }
        .access-denied h1 { font-size: 30px; color: var(--primary); margin-bottom: 10px; }
        .access-denied p { color: var(--text-muted); margin-bottom: 20px; }
        .btn-back { background: var(--primary); color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; }

        /* --- LAYOUT POS --- */
        .pos-container { display: none; width: 100%; height: 100vh; }
        
        /* KIRI: MENU MAKANAN (Gaya persis index.html) */
        .menu-area { flex-grow: 1; padding: 20px; overflow-y: auto; border-right: 1px solid var(--border); background: var(--bg-main); }
        .header-pos { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: sticky; top: 0; background: var(--bg-main); z-index: 10; padding-bottom: 10px;}
        .header-pos h2 { font-size: 20px; font-weight: 800; }
        .btn-logout { background: rgba(229, 57, 53, 0.2); color: var(--primary); border: 1px solid var(--primary); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }

        /* Category Tabs */
        .category-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; }
        .cat-btn { background: var(--bg-card); border: 1px solid transparent; color: var(--text-muted); padding: 8px 12px; border-radius: var(--radius-md); font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { border-color: var(--primary); background: rgba(229, 57, 53, 0.1); color: var(--text-main); }

        /* Grid Menu Persis Index */
        .menu-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
        .menu-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 6px; display: flex; flex-direction: column; position: relative; }
        .menu-img { width: 100%; aspect-ratio: 1 / 1; border-radius: var(--radius-sm); object-fit: cover; background: var(--bg-input); margin-bottom: 6px; }
        .menu-badge { position: absolute; top: 10px; left: 10px; background: var(--primary); color: #fff; font-size: 7px; font-weight: 800; padding: 2px 4px; border-radius: 3px; z-index: 2; }
        .menu-title { font-size: 10px; font-weight: 700; margin-bottom: 2px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .menu-type { font-size: 8px; color: var(--text-muted); margin-bottom: 6px; }
        .menu-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .menu-price { font-size: 11px; font-weight: 800; color: var(--accent); }
        .btn-add { background: var(--primary); color: #fff; border: none; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; transition: transform 0.1s; }
        .qty-wrap { display: flex; align-items: center; gap: 4px; background: var(--bg-input); padding: 2px; border-radius: 12px; }
        .qty-btn { background: #262626; border: none; color: #fff; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; cursor: pointer; }
        .qty-num { font-size: 10px; font-weight: 700; min-width: 10px; text-align: center; }

        /* KANAN: KERANJANG & PEMBAYARAN */
        .cart-area { width: 350px; background: var(--bg-card); display: flex; flex-direction: column; padding: 20px; border-left: 1px solid var(--border); }
        .cart-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .cart-list { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
        .cart-item-info { flex-grow: 1; }
        .cart-item-name { font-weight: 700; }
        .cart-item-price { color: var(--accent); font-size: 12px; }

        .cart-total-box { border-top: 2px solid var(--border); padding-top: 15px; margin-bottom: 15px; }
        .total-row { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; margin-bottom: 15px; }
        .total-row span:last-child { color: var(--primary); font-size: 20px; }
        .btn-pay { width: 100%; background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer; }

        /* --- MODAL PEMBAYARAN --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-box { background: var(--bg-card); border-radius: 16px; width: 100%; max-width: 400px; padding: 24px; text-align: center; }
        .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 15px; }
        .payment-methods { display: flex; gap: 10px; margin-bottom: 20px; }
        .pay-method-btn { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-main); color: white; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .pay-method-btn.active { border-color: var(--primary); background: rgba(229, 57, 53, 0.1); color: var(--primary); }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 16px; font-weight: 700; }
        .change-box { background: var(--bg-input); padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left; }
        .change-box div { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
        .change-box .kembalian { color: var(--accent); font-size: 18px; font-weight: 800; margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-cancel { flex: 1; padding: 15px; border-radius: 8px; border: none; background: #333; color: white; font-weight: 700; cursor: pointer; }
        .btn-confirm { flex: 2; padding: 15px; border-radius: 8px; border: none; background: var(--success); color: white; font-weight: 700; cursor: pointer; }
        
        @media (max-width: 768px) {
            .pos-container { flex-direction: column; }
            .cart-area { width: 100%; height: 50vh; border-left: none; border-top: 1px solid var(--border); }
            .menu-area { height: 50vh; }
        }
    </style>
</head>
<body>

    <!-- LAYAR DIBLOKIR -->
    <div class="access-denied" id="access-denied">
        <i class="fa-solid fa-lock" style="font-size: 50px; color: var(--primary); margin-bottom: 20px;"></i>
        <h1>Akses Ditolak</h1>
        <p>Halaman ini hanya untuk Akun Kasir resmi Kebab IDI.</p>
        <a href="index.html" class="btn-back">Kembali ke Beranda</a>
    </div>

    <!-- LAYAR UTAMA KASIR -->
    <div class="pos-container" id="pos-app">
        
        <div class="menu-area">
            <div class="header-pos">
                <h2>👨‍🍳 Kasir Kebab IDI</h2>
                <button class="btn-logout" onclick="prosesLogout()"><i class="fa-solid fa-right-from-bracket"></i> Tutup Kasir</button>
            </div>

            <div class="category-scroll">
                <button class="cat-btn active" id="tab-makanan" onclick="switchCategory('makanan')">🌯 Makanan</button>
                <button class="cat-btn" id="tab-minuman" onclick="switchCategory('minuman')">🥤 Minuman</button>
            </div>

            <div class="menu-list" id="menu-grid"></div>
        </div>

        <div class="cart-area">
            <div class="cart-title">🛒 Pesanan</div>
            <div class="cart-list" id="cart-list">
                <div style="text-align: center; color: var(--text-muted); margin-top: 20px;">Belum ada pesanan.</div>
            </div>
            
            <div class="cart-total-box">
                <div class="total-row">
                    <span>Total:</span>
                    <span id="total-price">Rp 0</span>
                </div>
                <button class="btn-pay" onclick="bukaPembayaran()">Bayar Sekarang</button>
            </div>
        </div>
    </div>

    <!-- MODAL PEMBAYARAN -->
    <div class="modal-overlay" id="payment-modal">
        <div class="modal-box">
            <div class="modal-title">Pilih Pembayaran</div>
            
            <div class="payment-methods">
                <button class="pay-method-btn active" id="btn-cash" onclick="pilihMetode('cash')">💵 Tunai</button>
                <button class="pay-method-btn" id="btn-qris" onclick="pilihMetode('qris')">📱 QRIS</button>
            </div>

            <div id="area-cash">
                <div class="form-group">
                    <label>Uang Diterima (Rp)</label>
                    <input type="number" id="uang-diterima" placeholder="Contoh: 50000" oninput="hitungKembalian()">
                </div>
                <div class="change-box">
                    <div><span>Total Tagihan:</span><span id="modal-total">Rp 0</span></div>
                    <div class="kembalian"><span>Kembalian:</span><span id="modal-kembalian">Rp 0</span></div>
                </div>
            </div>

            <div id="area-qris" style="display: none; margin-bottom: 20px;">
                <div style="background: white; padding: 20px; border-radius: 8px; display: inline-block;">
                    <i class="fa-solid fa-qrcode" style="font-size: 100px; color: black;"></i>
                </div>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">Scan QRIS, pastikan uang masuk.</p>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="tutupPembayaran()">Batal</button>
                <button class="btn-confirm" onclick="selesaikanPesanan()">✔ Simpan & Lunas</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCceiYONY_sx9ivD0CDDQGoB9OXm05h4CY",
            authDomain: "kebab-idi.firebaseapp.com",
            projectId: "kebab-idi",
            storageBucket: "kebab-idi.firebasestorage.app",
            messagingSenderId: "303997052314",
            appId: "1:303997052314:web:1db122bc5911297b710623"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ALLOWED_EMAIL = "rxstore101@gmail.com";
        let currentCategory = 'makanan';
        let cart = {};
        let metodePembayaran = 'cash';

        // DATA MENU PERSIS SEPERTI INDEX.HTML (Link Foto Sama)
        const menuData = [
            { id: 1, category: "makanan", type: "Kebab", name: "Telur Sosis", price: 10000, image: "https://images.unsplash.com/photo-1529006557810-274b9b2fc783?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 2, category: "makanan", type: "Kebab", name: "Daging", price: 10000, image: "https://images.unsplash.com/photo-1561651823-34feb02250e4?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 3, category: "makanan", type: "Kebab", name: "Daging Sosis", price: 13000, image: "https://images.unsplash.com/photo-1603360946369-dc9bb6258143?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 4, category: "makanan", type: "Kebab", name: "Daging Telur", price: 13000, image: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 5, category: "makanan", type: "Kebab", name: "Daging Telur Sosis", price: 15000, image: "https://images.unsplash.com/photo-1529042410759-befb1204b468?q=80&w=400&auto=format&fit=crop", badge: "BEST" },
            { id: 6, category: "makanan", type: "Kebab", name: "Daging Telur Sosis Keju", price: 18000, image: "https://images.unsplash.com/photo-1628840042765-356cda07504e?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 7, category: "minuman", type: "Minuman", name: "Sanger Dingin/Panas", price: 10000, image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 8, category: "minuman", type: "Minuman", name: "Americano Dingin/Panas", price: 10000, image: "https://images.unsplash.com/photo-1551030173-122aabc4489c?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 9, category: "minuman", type: "Minuman", name: "Americano Gula Aren", price: 12000, image: "https://images.unsplash.com/photo-1461023058943-07fcbe16d735?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 10, category: "minuman", type: "Minuman", name: "Teh Hijau Dingin", price: 8000, image: "https://images.unsplash.com/photo-1556881286-fc6915169721?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 11, category: "minuman", type: "Minuman", name: "Teh Hijau Panas", price: 5000, image: "https://images.unsplash.com/photo-1627435601361-ec25f5b1d0e5?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 12, category: "minuman", type: "Minuman", name: "Kopi Caramel", price: 15000, image: "https://images.unsplash.com/photo-1572442388796-11668a67e53d?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 13, category: "minuman", type: "Minuman", name: "Kopi Latte", price: 15000, image: "https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 14, category: "minuman", type: "Minuman", name: "Sirup Kurnia Dingin", price: 8000, image: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 15, category: "minuman", type: "Minuman", name: "Capucino", price: 15000, image: "https://images.unsplash.com/photo-1534778101976-62847782c213?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 16, category: "minuman", type: "Minuman", name: "Long Black", price: 10000, image: "https://images.unsplash.com/photo-1497935586351-b67a49e012bf?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 17, category: "minuman", type: "Minuman", name: "Sanger Double Shoot", price: 18000, image: "https://images.unsplash.com/photo-1442512595331-e89e73853f31?q=80&w=400&auto=format&fit=crop", badge: "" },
            { id: 18, category: "minuman", type: "Minuman", name: "Kopi Milo Dingin", price: 15000, image: "https://images.unsplash.com/photo-1572490122747-3968b75cc699?q=80&w=400&auto=format&fit=crop", badge: "" }
        ];

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ALLOWED_EMAIL) {
                document.getElementById('access-denied').style.display = 'none';
                document.getElementById('pos-app').style.display = 'flex';
                renderMenu();
            } else {
                document.getElementById('access-denied').style.display = 'flex';
                document.getElementById('pos-app').style.display = 'none';
            }
        });

        window.switchCategory = (category) => {
            currentCategory = category;
            document.getElementById('tab-makanan').classList.remove('active');
            document.getElementById('tab-minuman').classList.remove('active');
            document.getElementById(`tab-${category}`).classList.add('active');
            renderMenu();
        };

        function renderMenu() {
            const container = document.getElementById('menu-grid');
            const filteredMenu = menuData.filter(item => item.category === currentCategory);

            container.innerHTML = filteredMenu.map(item => {
                const qty = cart[item.id] || 0;
                return `
                    <div class="menu-card">
                        ${item.badge ? `<span class="menu-badge">${item.badge}</span>` : ''}
                        <img src="${item.image}" class="menu-img" loading="lazy" alt="${item.name}">
                        <div class="menu-title">${item.name}</div>
                        <div class="menu-type">${item.type}</div>
                        <div class="menu-bottom">
                            <span class="menu-price">Rp${(item.price/1000)}k</span>
                            ${qty === 0 
                                ? `<button class="btn-add" onclick="updateQty(${item.id}, 1)"><i class="fa-solid fa-plus"></i></button>`
                                : `<div class="qty-wrap">
                                    <button class="qty-btn" onclick="updateQty(${item.id}, -1)"><i class="fa-solid fa-minus"></i></button>
                                    <span class="qty-num">${qty}</span>
                                    <button class="qty-btn" onclick="updateQty(${item.id}, 1)"><i class="fa-solid fa-plus"></i></button>
                                   </div>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.updateQty = (id, change) => {
            if (!cart[id]) cart[id] = 0;
            cart[id] += change;
            if (cart[id] < 0) cart[id] = 0;
            renderMenu(); 
            renderKeranjang();
        };

        function renderKeranjang() {
            const list = document.getElementById('cart-list');
            let total = 0;
            let html = '';

            if (Object.keys(cart).length === 0 || Object.values(cart).every(v => v === 0)) {
                html = '<div style="text-align: center; color: var(--text-muted); margin-top: 20px;">Belum ada pesanan.</div>';
            } else {
                menuData.forEach(item => {
                    const qty = cart[item.id] || 0;
                    if (qty > 0) {
                        total += item.price * qty;
                        html += `
                            <div class="cart-item">
                                <div class="cart-item-info">
                                    <div class="cart-item-name">${item.name}</div>
                                    <div class="cart-item-price">Rp ${(item.price * qty).toLocaleString('id-ID')}</div>
                                </div>
                                <div class="qty-wrap" style="background:#000;">
                                    <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                                    <span class="qty-num">${qty}</span>
                                    <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                                </div>
                            </div>
                        `;
                    }
                });
            }

            list.innerHTML = html;
            document.getElementById('total-price').innerText = `Rp ${total.toLocaleString('id-ID')}`;
            document.getElementById('modal-total').innerText = `Rp ${total.toLocaleString('id-ID')}`;
            hitungKembalian();
        }

        window.bukaPembayaran = () => {
            let total = 0;
            menuData.forEach(item => { total += (cart[item.id] || 0) * item.price; });
            if (total === 0) { alert("Pilih menu terlebih dahulu!"); return; }
            document.getElementById('payment-modal').style.display = 'flex';
            document.getElementById('uang-diterima').value = '';
            pilihMetode('cash');
        };

        window.tutupPembayaran = () => {
            document.getElementById('payment-modal').style.display = 'none';
        };

        window.pilihMetode = (metode) => {
            metodePembayaran = metode;
            if (metode === 'cash') {
                document.getElementById('btn-cash').classList.add('active');
                document.getElementById('btn-qris').classList.remove('active');
                document.getElementById('area-cash').style.display = 'block';
                document.getElementById('area-qris').style.display = 'none';
            } else {
                document.getElementById('btn-qris').classList.add('active');
                document.getElementById('btn-cash').classList.remove('active');
                document.getElementById('area-cash').style.display = 'none';
                document.getElementById('area-qris').style.display = 'block';
            }
        };

        window.hitungKembalian = () => {
            let total = 0;
            menuData.forEach(item => { total += (cart[item.id] || 0) * item.price; });
            const diterima = parseInt(document.getElementById('uang-diterima').value) || 0;
            const kembalian = diterima - total;
            document.getElementById('modal-kembalian').innerText = kembalian > 0 ? `Rp ${kembalian.toLocaleString('id-ID')}` : 'Rp 0';
        };

        window.selesaikanPesanan = async () => {
            let total = 0;
            let rincian = [];
            menuData.forEach(item => {
                const qty = cart[item.id] || 0;
                if (qty > 0) {
                    total += item.price * qty;
                    rincian.push({ nama: item.name, qty: qty, harga: item.price });
                }
            });

            const diterima = parseInt(document.getElementById('uang-diterima').value) || 0;
            if (metodePembayaran === 'cash' && diterima < total) {
                alert("Uang yang diterima kurang dari total tagihan!"); return;
            }

            try {
                await addDoc(collection(db, "transaksi_kasir"), {
                    waktu: new Date().toISOString(),
                    rincian: rincian,
                    total: total,
                    metode: metodePembayaran,
                    uangDiterima: metodePembayaran === 'cash' ? diterima : total,
                    kembalian: metodePembayaran === 'cash' ? (diterima - total) : 0,
                    kasir: auth.currentUser.email
                });

                alert("✅ Transaksi Berhasil Disimpan!");
                cart = {};
                renderMenu();
                renderKeranjang();
                tutupPembayaran();
            } catch (error) {
                alert("❌ Gagal menyimpan transaksi: " + error.message);
            }
        };

        window.prosesLogout = () => {
            if (confirm("Tutup sesi kasir?")) {
                signOut(auth).then(() => window.location.href = 'index.html');
            }
        };
    </script>
</body>
</html>
