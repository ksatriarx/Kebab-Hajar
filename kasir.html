<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kebab IDI - POS Kasir & Online</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#050505;--card:#121212;--card2:#181818;--line:#262626;--muted:#8a8a8a;--text:#fff;--red:#e53935;--red2:#b71c1c;--amber:#ffb300;--green:#10b981;--r:16px}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(900px 500px at 50% -15%,rgba(229,57,53,.16),transparent 60%),var(--bg);color:var(--text);overflow:hidden;height:100vh;height:100dvh}
button{font:inherit;cursor:pointer;border:none;transition:transform .15s,filter .2s,background .2s,border-color .2s,color .2s}
button:active{transform:scale(.95)}
input{font:inherit}

.access-denied{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:var(--bg)}
.access-denied h1{font-size:26px;color:var(--red);margin:14px 0 8px}
.access-denied p{font-size:13px;color:var(--muted)}
.btn-back{background:var(--red);color:#fff;text-decoration:none;padding:11px 20px;border-radius:12px;font-weight:800;margin-top:18px;box-shadow:0 6px 18px rgba(229,57,53,.35)}

.app{display:none;flex-direction:column;height:100%;max-width:520px;margin:0 auto;width:100%}

/* HEADER */
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:10px;background:rgba(10,10,10,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:900;letter-spacing:-.3px;color:var(--red)}
.brand b{color:#fff}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--red),var(--red2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;box-shadow:0 6px 16px rgba(229,57,53,.4)}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0}
.email{font-size:9px;color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;gap:6px}
.ibtn{width:32px;height:32px;border-radius:10px;background:#161616;border:1px solid var(--line);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;text-decoration:none}
.ibtn:hover{border-color:var(--red);color:var(--red)}
.ibtn-admin{display:none}
.logout{height:32px;padding:0 12px;border-radius:10px;background:rgba(229,57,53,.12);color:var(--red);border:1px solid var(--red);font-size:10px;font-weight:800}
.logout:hover{background:var(--red);color:#fff}

/* TABS */
.tabs{display:flex;gap:6px;padding:10px 12px;background:#0b0b0b;border-bottom:1px solid var(--line);flex-shrink:0}
.tab{flex:1;padding:10px 8px;border-radius:12px;background:#121212;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px}
.tab.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(229,57,53,.35)}
.badge{background:var(--amber);color:#000;font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;display:none}
.badge.show{display:inline-block;animation:pop .6s ease}
@keyframes pop{50%{transform:scale(1.2)}}

/* AREAS */
main{flex:1;min-height:0;position:relative}
.area{display:none;height:100%;overflow-y:auto;padding:12px 12px 130px}
.area.active{display:block}

/* ONLINE */
.online-list{display:flex;flex-direction:column;gap:12px}
.ocard{position:relative;background:linear-gradient(180deg,#171717,#0e0e0e);border:1px solid #232323;border-radius:var(--r);padding:14px 14px 12px 16px;overflow:hidden;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.ocard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber)}
.ocard.new::before{background:var(--red)}
.ocard-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.qno{background:var(--red);color:#fff;font-size:11px;font-weight:900;padding:4px 10px;border-radius:999px}
.oid,.otime{font-size:10px;color:var(--muted)}
.oname{font-size:15px;font-weight:900;letter-spacing:-.2px}
.omail{font-size:10px;color:var(--amber);margin:2px 0 8px}
.odetail{font-size:10.5px;line-height:1.55;color:#c4c4c4;background:#0a0a0a;border:1px solid #1f1f1f;border-radius:12px;padding:10px;white-space:pre-wrap;margin-bottom:10px}
.ofoot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #2a2a2a;padding-top:10px;gap:8px}
.ototal{font-size:14px;font-weight:900}
.oacts{display:flex;gap:6px;align-items:center}
.stlabel{font-size:10px;font-weight:800;color:var(--amber)}
.bact{padding:8px 11px;border-radius:9px;font-size:10.5px;font-weight:800;display:flex;align-items:center;gap:5px}
.bproses{background:rgba(255,179,0,.14);color:var(--amber);border:1px solid var(--amber)}
.bproses:hover{background:var(--amber);color:#000}
.bselesai{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(16,185,129,.3)}
.empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:12px}
.empty i{font-size:30px;opacity:.3;display:block;margin-bottom:10px}

/* MENU */
.cats{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{padding:8px 16px;border-radius:999px;background:#111;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:800;white-space:nowrap}
.cat.active{color:var(--red);border-color:var(--red);background:rgba(229,57,53,.1);box-shadow:0 4px 14px rgba(229,57,53,.2)}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pcard{position:relative;background:linear-gradient(180deg,#171717,#0e0e0e);border:1px solid #232323;border-radius:14px;padding:6px;display:flex;flex-direction:column;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.pimg{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;margin-bottom:6px;background:#0a0a0a}
.ptitle{font-size:10.5px;font-weight:800;line-height:1.25;min-height:26px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:3px}
.pprice{font-size:10.5px;font-weight:900;color:var(--amber);margin-bottom:7px}
.pbottom{margin-top:auto}
.padd{width:100%;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-size:10.5px;font-weight:800;box-shadow:0 4px 12px rgba(229,57,53,.25)}
.padd:hover{filter:brightness(1.1)}
.padd:disabled{background:var(--amber);color:#000;box-shadow:none;cursor:not-allowed}
.qty{display:flex;justify-content:space-between;align-items:center;height:32px;border-radius:9px;background:#0a0a0a;border:1px solid #2a2a2a}
.qty button{width:30px;height:100%;background:transparent;color:#fff;font-size:15px;font-weight:900}
.qty button:hover{color:var(--red)}
.qty span{font-size:11px;font-weight:900}
/* Label sticker dari data */
.lbl{position:absolute;top:-7px;left:-5px;z-index:2;padding:3px 7px;border-radius:6px;font-size:8px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;border:2px solid #000;box-shadow:2px 2px 0 #000;transform:rotate(-5deg);color:#000;white-space:nowrap}
.lbl-r{background:#ff5252;color:#fff}
.lbl-a{background:var(--amber)}
.lbl-g{background:#34d399}
.lbl-w{background:#fff}
.mgrid-empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:11px;padding:24px}

/* FLOATING CART */
.fcart{position:fixed;left:50%;bottom:14px;transform:translate(-50%,160px);width:calc(100% - 28px);max-width:480px;background:linear-gradient(135deg,var(--red),var(--red2));border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 30px rgba(229,57,53,.45);transition:transform .3s ease;z-index:90;cursor:pointer}
.fcart.show{transform:translate(-50%,0)}
.fcart small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.6px;opacity:.85;font-weight:800}
.fcart b{font-size:15px;font-weight:900}
.fcart .go{background:#fff;color:var(--red);padding:9px 14px;border-radius:10px;font-weight:900;font-size:11px}

/* CART SHEET */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:1000;display:none}
.ov.show{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:520px;height:70vh;background:linear-gradient(180deg,#141414,#0c0c0c);border-radius:26px 26px 0 0;border-top:3px solid var(--red);padding:24px 16px 16px;display:flex;flex-direction:column;z-index:1001;transition:transform .3s ease;box-shadow:0 -20px 50px rgba(0,0,0,.9)}
.sheet.show{transform:translate(-50%,0)}
.sheet::before{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:4px;background:#333}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.shead h2{font-size:15px;font-weight:900}
.shead-r{display:flex;gap:10px;align-items:center}
.reset{background:none;color:var(--muted);font-size:10px;font-weight:700}
.reset:hover{color:var(--red)}
.xbtn{width:32px;height:32px;border-radius:50%;background:#1c1c1c;border:1px solid #2a2a2a;color:#fff}
.xbtn:hover{border-color:var(--red);color:var(--red)}
.clist{flex:1;overflow-y:auto;border-bottom:1px dashed #222;padding-bottom:10px;margin-bottom:10px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;margin-bottom:8px;background:#161616;border:1px solid #222;border-radius:12px}
.crow b{font-size:12px;display:block}
.crow small{font-size:10.5px;color:var(--amber)}
.crow strong{font-size:11.5px;font-weight:900}
.ctotal{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ctotal span{font-size:12px;color:var(--muted)}
.ctotal b{font-size:22px;font-weight:900;color:var(--red);text-shadow:0 0 20px rgba(229,57,53,.3)}
.bpay{width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-size:14px;font-weight:900;box-shadow:0 8px 22px rgba(229,57,53,.35)}

/* POPUP PEMBAYARAN (mengambang, bisa digeser & diubah ukuran) */
.pay-win{position:fixed;display:none;flex-direction:column;z-index:1005;background:linear-gradient(180deg,#151515,#0d0d0d);border:1px solid #2a2a2a;border-radius:20px;box-shadow:0 30px 60px rgba(0,0,0,.75);width:360px;height:520px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden}
.pay-win.open{display:flex}
.phead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #222;cursor:grab;user-select:none;touch-action:none;flex-shrink:0}
.phead:active{cursor:grabbing}
.phead h3{font-size:13px;font-weight:900;display:flex;align-items:center;gap:6px}
.phead h3::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.psizes{display:flex;gap:4px;align-items:center}
.psz{width:24px;height:24px;border-radius:7px;background:#1a1a1a;border:1px solid #2a2a2a;color:var(--muted);font-size:10px;font-weight:900}
.psz.on{color:#fff;border-color:var(--red);background:rgba(229,57,53,.2)}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px}
.pmeth{display:flex;gap:6px;flex-shrink:0}
.pm{flex:1;padding:8px;border-radius:11px;background:#0a0a0a;border:1px solid #2a2a2a;color:#fff;font-size:11px;font-weight:800}
.pm.active{border-color:var(--red);background:rgba(229,57,53,.12);color:var(--red);box-shadow:0 4px 14px rgba(229,57,53,.2)}
.cashbox{flex-shrink:0}
.cashbox label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:700}
.cashin{width:100%;padding:10px;border-radius:12px;background:#0a0a0a;border:1px solid #2a2a2a;color:#fff;font-size:18px;font-weight:900;text-align:right;outline:none}
.cashin:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,57,53,.15)}
.qris{display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;flex-shrink:0;padding:6px;font-size:11px;color:var(--muted)}
.qris i{font-size:56px;color:#000;background:#fff;padding:8px;border-radius:12px}
.totals{display:flex;justify-content:space-between;background:#0a0a0a;border:1px dashed #2a2a2a;border-radius:12px;padding:8px 10px;flex-shrink:0}
.totals div{display:flex;flex-direction:column;gap:2px}
.totals span{font-size:9.5px;color:var(--muted);font-weight:700}
.totals b{font-size:13px;font-weight:900}
.totals .ch b{color:var(--amber);font-size:15px;text-shadow:0 0 14px rgba(255,179,0,.25)}
.keypad-wrap{flex:1;min-height:0;border-radius:14px;padding:6px;background-color:#0a0a0a;background-image:radial-gradient(circle,rgba(255,255,255,.1) 1.2px,transparent 1.6px);background-size:14px 14px;display:flex}
.keypad{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(0,1fr));gap:6px;width:100%}
.keypad button{border-radius:12px;background:#111;border:1px solid #2a2a2a;color:#fff;font-size:clamp(13px,3.6vh,18px);font-weight:800;display:flex;align-items:center;justify-content:center;min-height:0}
.keypad button:hover{border-color:#3a3a3a}
.keypad button:active{background:#1c1c1c}
.keypad .kc{color:var(--red)}
.keypad .kd{color:var(--amber)}
.keypad-wrap.hide{display:none}
.pact{display:flex;gap:8px;flex-shrink:0}
.pact button{flex:1;padding:11px;border-radius:12px;font-size:12px;font-weight:800}
.pcancel{background:#2a2a2a;color:#fff}
.pcancel:hover{background:#3a3a3a}
.pconfirm{background:var(--green);color:#fff;flex:2!important;box-shadow:0 6px 16px rgba(16,185,129,.25)}
.pconfirm:hover{filter:brightness(1.08)}
.resize{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,#555 50%,#555 58%,transparent 58%,transparent 72%,#555 72%,#555 80%,transparent 80%);border-bottom-right-radius:18px;opacity:.85}

/* LANDSCAPE: tata letak dua kolom, tetap kecil dan rapi */
@media (orientation:landscape) and (max-height:520px){
  .app{max-width:100%}
  .top{padding:6px 12px}
  .logo{width:28px;height:28px;font-size:13px}
  .brand{font-size:14px}
  .tabs{padding:6px 10px}
  .tab{padding:7px}
  .area{padding:10px 10px 90px}
  .menu-grid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
  .online-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
  .fcart{bottom:8px;padding:8px 12px;width:50%;max-width:320px}
}
</style>
</head>
<body>

<div class="access-denied" id="access-denied">
  <i class="fa-solid fa-lock" style="font-size:46px;color:var(--red)"></i>
  <h1>Akses Ditolak</h1>
  <p>Halaman ini hanya untuk Akun Kasir resmi Kebab IDI.</p>
  <a href="index.html" class="btn-back">Kembali ke Beranda</a>
</div>

<div class="app" id="pos-app">
  <header class="top">
    <div class="brand"><span class="logo"><i class="fa-solid fa-utensils"></i></span><div>Kebab<b>Hajar</b></div></div>
    <div class="top-right">
      <div class="email" id="header-email">-</div>
      <div class="top-actions">
        <button class="ibtn" onclick="toggleFullscreen()" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
        <a href="pengaturan-toko.html" id="btn-settings-admin" class="ibtn ibtn-admin" title="Pengaturan Toko"><i class="fa-solid fa-gear"></i></a>
        <button class="logout" onclick="prosesLogout()">Tutup</button>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button id="tab-btn-online" class="tab active" onclick="switchTab('online')">Pesanan Web <span id="badge-online" class="badge">0</span></button>
    <button id="tab-btn-offline" class="tab" onclick="switchTab('offline')">Kasir Offline</button>
  </nav>

  <main>
    <section id="area-online" class="area active">
      <div id="online-orders-list" class="online-list"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i>Memuat pesanan...</div></div>
    </section>
    <section id="area-offline" class="area">
      <div class="cats">
        <button class="cat active" id="cat-makanan" onclick="switchCategory('makanan')">Makanan</button>
        <button class="cat" id="cat-minuman" onclick="switchCategory('minuman')">Minuman</button>
      </div>
      <div class="menu-grid" id="pos-menu-grid"></div>
    </section>
  </main>
</div>

<div class="fcart" id="floating-cart-bar" onclick="toggleCart()">
  <div><small id="float-count">0 Item</small><b id="float-total">Rp 0</b></div>
  <span class="go">Lihat Keranjang <i class="fa-solid fa-chevron-up"></i></span>
</div>

<div class="ov" id="cart-overlay" onclick="toggleCart()"></div>

<div class="sheet" id="cart-section">
  <div class="shead">
    <h2>Keranjang Kasir</h2>
    <div class="shead-r">
      <button class="reset" onclick="resetCart()"><i class="fa-solid fa-trash"></i> Reset</button>
      <button class="xbtn" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>
  <div class="clist" id="pos-cart-list"><div class="empty">Belum ada item.</div></div>
  <div class="ctotal"><span>Total</span><b id="pos-total">Rp 0</b></div>
  <button class="bpay" onclick="bukaPembayaran()">Bayar Sekarang</button>
</div>

<div class="pay-win" id="payment-modal">
  <div class="phead" id="pay-head">
    <h3>Pembayaran</h3>
    <div class="psizes">
      <button class="psz" data-size="S" onclick="setSize('S')">S</button>
      <button class="psz on" data-size="M" onclick="setSize('M')">M</button>
      <button class="psz" data-size="L" onclick="setSize('L')">L</button>
      <button class="psz" onclick="tutupPembayaran()" style="margin-left:4px"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>
  <div class="pbody">
    <div class="pmeth">
      <button class="pm active" id="btn-cash" onclick="pilihMetode('cash')">💵 Tunai</button>
      <button class="pm" id="btn-qris" onclick="pilihMetode('qris')">📱 QRIS</button>
    </div>
    <div class="cashbox" id="area-cash">
      <label>Uang Diterima (Rp)</label>
      <input type="text" id="uang-diterima" class="cashin" placeholder="0" readonly>
    </div>
    <div class="qris" id="area-qris"><i class="fa-solid fa-qrcode"></i>Scan QRIS untuk membayar</div>
    <div class="totals">
      <div><span>Total Tagihan</span><b id="modal-total">Rp 0</b></div>
      <div class="ch" style="text-align:right"><span>Kembalian</span><b id="modal-kembalian">Rp 0</b></div>
    </div>
    <div class="keypad-wrap" id="custom-keypad-area">
      <div class="keypad">
        <button onclick="pressNum('1')">1</button><button onclick="pressNum('2')">2</button><button onclick="pressNum('3')">3</button>
        <button onclick="pressNum('4')">4</button><button onclick="pressNum('5')">5</button><button onclick="pressNum('6')">6</button>
        <button onclick="pressNum('7')">7</button><button onclick="pressNum('8')">8</button><button onclick="pressNum('9')">9</button>
        <button class="kc" onclick="clearNum()">C</button><button onclick="pressNum('0')">0</button><button class="kd" onclick="deleteNum()"><i class="fa-solid fa-delete-left"></i></button>
      </div>
    </div>
    <div class="pact">
      <button class="pcancel" onclick="tutupPembayaran()">Batal</button>
      <button class="pconfirm" onclick="selesaikanPesanan()">✔ Simpan</button>
    </div>
  </div>
  <div class="resize" id="pay-resize"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCceiYONY_sx9ivD0CDDQGoB9OXm05h4CY", authDomain: "kebab-idi.firebaseapp.com", projectId: "kebab-idi", storageBucket: "kebab-idi.firebasestorage.app", messagingSenderId: "303997052314", appId: "1:303997052314:web:1db122bc5911297b710623" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
const ALLOWED_EMAIL = "rxstore101@gmail.com";

let menuData = [], cart = {}, metodePembayaran = 'cash', currentCategory = 'makanan', currentTab = 'online';
let inputUangString = "", isFirstLoad = true, knownOrderIds = new Set(), audioCtx = null;

const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LBL_CLASS = ['lbl-r', 'lbl-a', 'lbl-g', 'lbl-w'];
const labelClass = txt => { let h = 0; for (const ch of txt) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return LBL_CLASS[h % LBL_CLASS.length]; };
const totalCart = () => Object.keys(cart).reduce((sum, id) => { const it = menuData.find(i => i.id === parseInt(id)); return it ? sum + it.price * cart[id] : sum; }, 0);
const itemCount = () => Object.values(cart).reduce((a, b) => a + (b > 0 ? b : 0), 0);

window.toggleFullscreen = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
  else document.exitFullscreen?.();
};
document.body.addEventListener('click', function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });
function playNotifSound() {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(440, t + .1);
    g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.01, t + .3);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(t + .3);
  } catch (e) {}
}

onAuthStateChanged(auth, user => {
  if (user && user.email === ALLOWED_EMAIL) {
    document.getElementById('access-denied').style.display = 'none';
    document.getElementById('pos-app').style.display = 'flex';
    document.getElementById('header-email').innerText = user.email;
    document.getElementById('btn-settings-admin').style.display = 'flex';
    loadMenuOffline(); listenOnlineOrders();
  } else {
    document.getElementById('access-denied').style.display = 'flex';
    document.getElementById('pos-app').style.display = 'none';
  }
});

window.switchTab = tab => {
  currentTab = tab;
  ['online', 'offline'].forEach(t => {
    document.getElementById('area-' + t).classList.toggle('active', t === tab);
    document.getElementById('tab-btn-' + t).classList.toggle('active', t === tab);
  });
  renderCartBar();
};

window.toggleCart = () => {
  document.getElementById('cart-section').classList.toggle('show');
  document.getElementById('cart-overlay').classList.toggle('show');
};

function listenOnlineOrders() {
  const q = query(collection(db, "transaksi_online"), orderBy("waktu", "desc"));
  onSnapshot(q, snapshot => {
    const list = document.getElementById('online-orders-list');
    let html = '', countAktif = 0, currentIds = new Set(), newOrderArrived = false, queue = 1;
    snapshot.forEach(d => {
      const data = d.data(), docId = d.id;
      if (data.status === 'Selesai' || data.status === 'Dibatalkan') return;
      countAktif++; currentIds.add(docId);
      if (!knownOrderIds.has(docId) && !isFirstLoad) newOrderArrived = true;
      const tgl = data.waktu ? new Date(data.waktu).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' }) : '-';
      const isProses = ['Sedang Dimasak', 'Sedang Diantar', 'Siap Diambil'].includes(data.status);
      const aksi = !isProses
        ? `<button class="bact bproses" onclick="updateStatusOnline('${docId}','Sedang Dimasak')"><i class="fa-solid fa-fire"></i> Proses</button>`
        : `<span class="stlabel">${esc(data.status)}</span>`;
      html += `<div class="ocard ${isProses ? '' : 'new'}">
        <div class="ocard-top"><span class="qno">Antrean #${queue}</span><span class="otime">${tgl}</span></div>
        <div class="oname">${esc(data.nama)}</div>
        <div class="omail"><i class="fa-solid fa-envelope"></i> ${esc(data.email)}</div>
        <div class="odetail">${esc(data.detail_pesanan)}</div>
        <div class="ofoot"><div class="ototal">${rp(data.total_bayar)}</div>
          <div class="oacts">${aksi}<button class="bact bselesai" onclick="updateStatusOnline('${docId}','Selesai')"><i class="fa-solid fa-check"></i> Selesai</button></div></div>
      </div>`;
      queue++;
    });
    if (newOrderArrived) playNotifSound();
    knownOrderIds = currentIds; isFirstLoad = false;
    const badge = document.getElementById('badge-online');
    if (countAktif === 0) {
      list.innerHTML = `<div class="empty"><i class="fa-solid fa-mug-hot"></i>Tidak ada pesanan online baru.</div>`;
      badge.classList.remove('show');
    } else {
      list.innerHTML = html; badge.innerText = countAktif; badge.classList.add('show');
    }
  });
}

window.updateStatusOnline = async (docId, newStatus) => {
  try { await updateDoc(doc(db, "transaksi_online", docId), { status: newStatus }); }
  catch (e) { alert("Gagal: " + e.message); }
};

function loadMenuOffline() {
  onSnapshot(collection(db, "menu_kebab"), snapshot => {
    menuData = [];
    snapshot.forEach(d => menuData.push(d.data()));
    menuData.sort((a, b) => a.id - b.id);
    renderPosMenu(); renderPosCart();
  });
}

window.switchCategory = cat => {
  currentCategory = cat;
  document.getElementById('cat-makanan').classList.toggle('active', cat === 'makanan');
  document.getElementById('cat-minuman').classList.toggle('active', cat === 'minuman');
  renderPosMenu();
};

function renderPosMenu() {
  const grid = document.getElementById('pos-menu-grid');
  const filtered = menuData.filter(i => i.category === currentCategory);
  if (!filtered.length) { grid.innerHTML = `<div class="mgrid-empty">Belum ada menu.</div>`; return; }
  grid.innerHTML = filtered.map(item => {
    const qty = cart[item.id] || 0;
    const isPersiapan = item.status === 'persiapan';
    const label = (item.label || '').toString().trim();
    const sticker = label ? `<span class="lbl ${labelClass(label)}">${esc(label)}</span>` : '';
    let aksi;
    if (isPersiapan) aksi = `<button class="padd" disabled>Persiapan</button>`;
    else aksi = qty === 0
      ? `<button class="padd" onclick="addToCart(${item.id})">Tambah</button>`
      : `<div class="qty"><button onclick="updateQty(${item.id},-1)">−</button><span>${qty}</span><button onclick="updateQty(${item.id},1)">+</button></div>`;
    return `<div class="pcard">${sticker}<img src="${esc(item.image)}" class="pimg" alt="${esc(item.name)}"><div class="ptitle">${esc(item.name)}</div><div class="pprice">${rp(item.price)}</div><div class="pbottom">${aksi}</div></div>`;
  }).join('');
}

window.addToCart = id => updateQty(id, 1);
window.updateQty = (id, change) => {
  cart[id] = Math.max(0, (cart[id] || 0) + change);
  renderPosMenu(); renderPosCart();
};

function renderPosCart() {
  const list = document.getElementById('pos-cart-list');
  let html = '';
  Object.keys(cart).forEach(id => {
    if (cart[id] > 0) {
      const item = menuData.find(i => i.id === parseInt(id));
      if (item) html += `<div class="crow"><div><b>${esc(item.name)}</b><small>${cart[id]} x ${rp(item.price)}</small></div><strong>${rp(item.price * cart[id])}</strong></div>`;
    }
  });
  list.innerHTML = html || `<div class="empty">Belum ada item.</div>`;
  const total = totalCart();
  document.getElementById('pos-total').innerText = rp(total);
  document.getElementById('modal-total').innerText = rp(total);
  document.getElementById('float-count').innerText = `${itemCount()} Item`;
  document.getElementById('float-total').innerText = rp(total);
  renderCartBar();
  if (!html) document.getElementById('cart-section').classList.remove('show');
}

function renderCartBar() {
  const show = currentTab === 'offline' && itemCount() > 0;
  document.getElementById('floating-cart-bar').classList.toggle('show', show);
}

window.resetCart = () => {
  if (confirm("Kosongkan keranjang?")) { cart = {}; renderPosMenu(); renderPosCart(); toggleCart(); }
};

/* ===== POPUP PEMBAYARAN ===== */
const pay = document.getElementById('payment-modal');
const SIZES = { S: [300, 400], M: [360, 520], L: [460, 620] };
let payPositioned = false, currentSize = 'M';

function setSize(key) {
  currentSize = key;
  const [w, h] = SIZES[key];
  pay.style.width = Math.min(w, innerWidth - 16) + 'px';
  pay.style.height = Math.min(h, innerHeight - 16) + 'px';
  document.querySelectorAll('.psz[data-size]').forEach(b => b.classList.toggle('on', b.dataset.size === key));
  clampPay();
}
window.setSize = setSize;

function clampPay() {
  if (!payPositioned) return;
  const r = pay.getBoundingClientRect();
  pay.style.left = Math.max(0, Math.min(r.left, innerWidth - pay.offsetWidth)) + 'px';
  pay.style.top = Math.max(0, Math.min(r.top, innerHeight - pay.offsetHeight)) + 'px';
}

window.bukaPembayaran = () => {
  if (totalCart() === 0) { alert("Pilih menu dulu!"); return; }
  inputUangString = "";
  document.getElementById('uang-diterima').value = "";
  document.getElementById('modal-kembalian').innerText = "Rp 0";
  pilihMetode('cash');
  pay.classList.add('open');
  if (!payPositioned) { setSize(currentSize); } else { clampPay(); }
  renderPosCart();
};

window.tutupPembayaran = () => pay.classList.remove('open');

window.pilihMetode = metode => {
  metodePembayaran = metode;
  const cash = metode === 'cash';
  document.getElementById('btn-cash').classList.toggle('active', cash);
  document.getElementById('btn-qris').classList.toggle('active', !cash);
  document.getElementById('area-cash').style.display = cash ? 'block' : 'none';
  document.getElementById('custom-keypad-area').classList.toggle('hide', !cash);
  document.getElementById('area-qris').style.display = cash ? 'none' : 'flex';
};

window.pressNum = num => {
  if (inputUangString.length > 9) return;
  if (inputUangString === "0") inputUangString = "";
  inputUangString += num; updateInputUang();
};
window.deleteNum = () => { inputUangString = inputUangString.slice(0, -1); updateInputUang(); };
window.clearNum = () => { inputUangString = ""; updateInputUang(); };
function updateInputUang() { document.getElementById('uang-diterima').value = inputUangString; hitungKembalian(); }

window.hitungKembalian = () => {
  const diterima = parseInt(inputUangString) || 0;
  const kembalian = diterima - totalCart();
  document.getElementById('modal-kembalian').innerText = kembalian > 0 ? rp(kembalian) : 'Rp 0';
};

/* Seret popup dari header */
const head = document.getElementById('pay-head');
let dragOff = null;
head.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  const r = pay.getBoundingClientRect();
  payPositioned = true;
  pay.style.transform = 'none';
  pay.style.left = r.left + 'px'; pay.style.top = r.top + 'px';
  dragOff = { x: e.clientX - r.left, y: e.clientY - r.top };
  head.setPointerCapture(e.pointerId);
});
head.addEventListener('pointermove', e => {
  if (!dragOff) return;
  pay.style.left = Math.max(0, Math.min(e.clientX - dragOff.x, innerWidth - pay.offsetWidth)) + 'px';
  pay.style.top = Math.max(0, Math.min(e.clientY - dragOff.y, innerHeight - pay.offsetHeight)) + 'px';
});
const endDrag = () => { dragOff = null; };
head.addEventListener('pointerup', endDrag);
head.addEventListener('pointercancel', endDrag);

/* Ubah ukuran dari pojok kanan bawah */
const rz = document.getElementById('pay-resize');
let rzStart = null;
rz.addEventListener('pointerdown', e => {
  const r = pay.getBoundingClientRect();
  payPositioned = true;
  pay.style.transform = 'none';
  pay.style.left = r.left + 'px'; pay.style.top = r.top + 'px';
  rzStart = { x: e.clientX, y: e.clientY, w: r.width, h: r.height };
  rz.setPointerCapture(e.pointerId);
  e.preventDefault();
});
rz.addEventListener('pointermove', e => {
  if (!rzStart) return;
  const left = parseFloat(pay.style.left) || 0, top = parseFloat(pay.style.top) || 0;
  const w = Math.max(260, Math.min(rzStart.w + e.clientX - rzStart.x, innerWidth - left));
  const h = Math.max(300, Math.min(rzStart.h + e.clientY - rzStart.y, innerHeight - top));
  pay.style.width = w + 'px'; pay.style.height = h + 'px';
  document.querySelectorAll('.psz[data-size]').forEach(b => b.classList.remove('on'));
});
const endRz = () => { rzStart = null; };
rz.addEventListener('pointerup', endRz);
rz.addEventListener('pointercancel', endRz);

window.addEventListener('resize', () => { if (pay.classList.contains('open')) { if (payPositioned) clampPay(); else setSize(currentSize); } });

window.selesaikanPesanan = async () => {
  const total = totalCart();
  const rincian = [];
  Object.keys(cart).forEach(id => {
    const qty = cart[id];
    if (qty > 0) {
      const item = menuData.find(i => i.id === parseInt(id));
      if (item) rincian.push({ nama: item.name, qty, harga: item.price, id: item.id });
    }
  });
  if (total === 0) { alert("Pilih menu dulu!"); return; }
  const diterima = parseInt(inputUangString) || 0;
  if (metodePembayaran === 'cash' && diterima < total) { alert("Uang diterima kurang!"); return; }
  try {
    await addDoc(collection(db, "transaksi_kasir"), {
      waktu: new Date().toISOString(), rincian, total, metode: metodePembayaran,
      uangDiterima: metodePembayaran === 'cash' ? diterima : total,
      kembalian: metodePembayaran === 'cash' ? (diterima - total) : 0,
      kasir: auth.currentUser.email
    });
    alert("✅ Transaksi Kasir Berhasil!");
    cart = {}; renderPosMenu(); renderPosCart(); tutupPembayaran();
    document.getElementById('cart-section').classList.remove('show');
    document.getElementById('cart-overlay').classList.remove('show');
  } catch (e) { alert("❌ Gagal: " + e.message); }
};

window.prosesLogout = () => {
  if (confirm("Tutup sesi kasir?")) signOut(auth).then(() => window.location.href = 'index.html');
};
</script>
