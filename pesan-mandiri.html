<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pesan Mandiri - Kebab Turki Hajar</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://app.midtrans.com/snap/snap.js" data-client-key="Mid-client-J7afOgiDqBEkS0ud"></script>
    
    <style>
        :root {
            --bg-main: #0f0f11; --bg-card: #1a1a1d; 
            --text-main: #f5f5f5; --text-muted: #888888;
            --primary: #e53935; --primary-hover: #b71c1c;
            --accent: #ffb300; --success: #34d399;
            --border: #2a2a2d;
            --radius-md: 12px; --radius-lg: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        .kiosk-container { width: 100%; max-width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        /* HEADER MINIMALIS */
        .header { background: var(--bg-card); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 10; }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .header h1 { font-size: 16px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        .header h1 span { color: var(--text-main); }
        .badge-service { font-size: 10px; font-weight: 700; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border); }
        
        .btn-fullscreen { background: transparent; border: 1px solid var(--border); color: var(--text-main); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-fullscreen:hover { background: rgba(255,255,255,0.05); }

        /* MENU AREA */
        .main-layout { display: flex; flex-direction: column; flex-grow: 1; overflow: hidden; padding: 12px; }
        .menu-area { flex-grow: 1; overflow-y: auto; padding-bottom: 80px; }
        
        .category-pills { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
        .category-pills::-webkit-scrollbar { display: none; }
        .cat-pill { background: var(--bg-card); border: 1px solid var(--border); padding: 6px 16px; border-radius: 16px; font-weight: 700; font-size: 11px; color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .cat-pill.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .menu-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .menu-img { width: 100%; aspect-ratio: 1/1; border-radius: 8px; object-fit: cover; margin-bottom: 6px; }
        .menu-title { font-size: 11px; font-weight: 700; margin-bottom: 2px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .menu-price { font-size: 11px; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
        .btn-add { background: var(--primary); color: white; border: none; width: 100%; padding: 6px; border-radius: 6px; font-weight: 700; font-size: 10px; cursor: pointer; transition: 0.2s; }
        .btn-add:active { background: var(--primary-hover); }
        .btn-add:disabled { background: #333; color: #666; cursor: not-allowed; }
        
        .qty-control { display: flex; justify-content: space-between; align-items: center; background: #121214; border-radius: 6px; padding: 3px; border: 1px solid var(--border); }
        .qty-control button { background: transparent; border: 1px solid var(--border); color: var(--text-main); width: 22px; height: 22px; border-radius: 4px; font-weight: bold; font-size: 10px; cursor: pointer; }
        .qty-control span { font-weight: 800; font-size: 11px; }

        /* FLOATING CART BUTTON */
        .floating-cart-btn { display: flex; position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 10px 20px; border-radius: 20px; font-weight: 800; font-size: 12px; box-shadow: 0 8px 20px rgba(229,57,53,0.3); z-index: 99; align-items: center; gap: 8px; border: none; cursor: pointer; width: 90%; max-width: 400px; justify-content: center; transition: 0.3s; }
        .floating-cart-btn:active { transform: translateX(-50%) scale(0.98); }

        /* MODAL / POPUP BASE */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(3px); display: none; align-items: flex-end; justify-content: center; z-index: 1000; }
        @media (min-width: 600px) { .modal-overlay { align-items: center; padding: 20px; } }
        .modal-overlay.show { display: flex; }
        
        .modal-box { background: var(--bg-card); border-radius: 20px 20px 0 0; width: 100%; max-width: 400px; padding: 20px 15px; text-align: center; border: 1px solid var(--border); border-bottom: none; animation: slideUp 0.3s ease; max-height: 85vh; display: flex; flex-direction: column; }
        @media (min-width: 600px) { .modal-box { border-radius: 16px; border-bottom: 1px solid var(--border); animation: popIn 0.3s ease; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-handle { width: 30px; height: 4px; background: #333; border-radius: 2px; margin: 0 auto 15px; flex-shrink: 0; }
        @media (min-width: 600px) { .modal-handle { display: none; } }
        
        .modal-title { font-size: 14px; font-weight: 800; margin-bottom: 15px; color: white; }
        
        /* KERANJANG POPUP */
        .cart-list-popup { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; border-bottom: 1px dashed var(--border); padding-bottom: 10px; max-height: 40vh; text-align: left; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #222; }
        .cart-item-info { flex-grow: 1; }
        .cart-item-name { font-size: 11px; font-weight: 700; color: white; }
        .cart-item-price { font-size: 10px; color: var(--text-muted); }
        .cart-item-total { font-size: 11px; font-weight: 800; color: var(--accent); }

        .total-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; margin-bottom: 15px; color: white; }
        
        .btn-primary { width: 100%; background: var(--success); color: #000; border: none; padding: 12px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; margin-bottom: 8px; }
        .btn-secondary { width: 100%; background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }

        /* MODAL PEMBAYARAN & QRIS */
        .pay-options { display: flex; gap: 10px; margin-bottom: 15px; }
        .pay-btn { flex: 1; padding: 15px 10px; border-radius: 12px; border: 1px solid var(--border); background: #121214; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: 0.2s; }
        .pay-btn:hover { border-color: var(--primary); }
        .pay-btn i { font-size: 22px; }
        .pay-btn span { font-weight: 800; font-size: 12px; color: white; }
        .pay-btn small { color: var(--text-muted); font-size: 9px; }
        
        .qris-image { width: 200px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border); }

        /* MODAL SUKSES */
        .success-icon { width: 60px; height: 60px; background: rgba(52, 211, 153, 0.1); color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 15px; }
        .queue-number { font-size: 36px; font-weight: 800; color: var(--accent); margin: 10px 0; }
    </style>
</head>
<body>

    <div class="kiosk-container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <h1><i class="fa-solid fa-utensils"></i> Kebab <span>Hajar</span></h1>
                <div class="badge-service">Self Service</div>
            </div>
            <button class="btn-fullscreen" onclick="toggleFullscreen()" title="Layar Penuh">
                <i class="fa-solid fa-expand" id="icon-fullscreen"></i>
            </button>
        </div>

        <div class="main-layout">
            <!-- MENU -->
            <div class="menu-area">
                <div class="category-pills">
                    <button class="cat-pill active" onclick="switchCategory('makanan')" id="cat-makanan">Makanan</button>
                    <button class="cat-pill" onclick="switchCategory('minuman')" id="cat-minuman">Minuman</button>
                </div>
                <div class="menu-grid" id="menu-grid">
                    <!-- Diisi JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Tombol Keranjang Melayang -->
    <button class="floating-cart-btn" onclick="openCartModal()" id="floating-cart-btn">
        <i class="fa-solid fa-cart-shopping"></i> Lihat Keranjang (<span id="floating-cart-count">0</span>)
    </button>

    <!-- MODAL KERANJANG -->
    <div class="modal-overlay" id="cart-modal" onclick="if(event.target===this) closeModal('cart-modal')">
        <div class="modal-box">
            <div class="modal-handle"></div>
            <h3 class="modal-title">Keranjang Anda</h3>
            <div class="cart-list-popup" id="cart-list-popup">
                <p style="text-align: center; color: var(--text-muted); font-size: 11px; margin-top: 10px;">Belum ada pesanan.</p>
            </div>
            <div class="total-row">
                <span>Total:</span>
                <span id="cart-total-popup">Rp 0</span>
            </div>
            <button class="btn-primary" onclick="openPaymentModal()">Lanjut Pembayaran</button>
            <button class="btn-secondary" onclick="closeModal('cart-modal')">Tutup</button>
        </div>
    </div>

    <!-- MODAL PILIH PEMBAYARAN -->
    <div class="modal-overlay" id="payment-modal" onclick="if(event.target===this) closeModal('payment-modal')">
        <div class="modal-box">
            <div class="modal-handle"></div>
            <h3 class="modal-title">Pilih Pembayaran</h3>
            <div class="pay-options">
                <button class="pay-btn" onclick="prosesTunai()">
                    <i class="fa-solid fa-money-bill-wave" style="color: var(--success);"></i>
                    <span>Tunai</span>
                    <small>Bayar di Kasir</small>
                </button>
                <button class="pay-btn" onclick="prosesQRIS()">
                    <i class="fa-solid fa-qrcode" style="color: var(--primary);"></i>
                    <span>QRIS</span>
                    <small>Scan & Bayar</small>
                </button>
            </div>
            <button class="btn-secondary" onclick="closeModal('payment-modal')">Batal</button>
        </div>
    </div>

    <!-- MODAL QRIS STATIS (MANUAL) -->
    <div class="modal-overlay" id="qris-manual-modal" onclick="if(event.target===this) closeModal('qris-manual-modal')">
        <div class="modal-box">
            <div class="modal-handle"></div>
            <h3 class="modal-title">Scan QRIS</h3>
            <p style="font-size: 10px; color: var(--text-muted); margin-bottom: 10px;">Scan menggunakan e-wallet atau m-banking Anda</p>
            
            <div>
                <img src="https://i.ibb.co.com/C38H9sTC/no-mark-React-Native-snapshot-image.png" class="qris-image" alt="QRIS">
            </div>
            <h2 style="font-size: 20px; font-weight: 800; color: var(--accent); margin-bottom: 15px;" id="qris-total-display">Rp 0</h2>
            
            <button class="btn-primary" onclick="konfirmasiQRISManual()">Saya Sudah Bayar</button>
            <button class="btn-secondary" onclick="closeModal('qris-manual-modal')">Batal</button>
        </div>
    </div>

    <!-- MODAL SUKSES -->
    <div class="modal-overlay" id="success-modal">
        <div class="modal-box">
            <div class="modal-handle"></div>
            <div class="success-icon"><i class="fa-solid fa-check"></i></div>
            <h3 class="modal-title" id="success-title">Pesanan Dibuat!</h3>
            <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 15px;" id="success-desc">Silakan tunjukkan nomor ini ke Kasir.</p>
            
            <div style="font-size: 10px; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Nomor Antrean</div>
            <div class="queue-number" id="display-queue">#00</div>
            
            <button class="btn-primary" onclick="kembaliKeAwal()" style="margin-top: 10px;">Selesai</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCceiYONY_sx9ivD0CDDQGoB9OXm05h4CY", authDomain: "kebab-idi.firebaseapp.com", projectId: "kebab-idi", storageBucket: "kebab-idi.firebasestorage.app", messagingSenderId: "303997052314", appId: "1:303997052314:web:1db122bc5911297b710623" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let menuData = []; let cart = {}; let currentCategory = 'makanan';

        // FITUR FULLSCREEN
        window.toggleFullscreen = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Gagal fullscreen: ${err.message}`);
                });
                document.getElementById('icon-fullscreen').className = 'fa-solid fa-compress';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    document.getElementById('icon-fullscreen').className = 'fa-solid fa-expand';
                }
            }
        };

        // 1. Ambil Data Menu
        onSnapshot(collection(db, "menu_kebab"), (snapshot) => {
            menuData = [];
            snapshot.forEach((doc) => { menuData.push(doc.data()); });
            menuData.sort((a, b) => a.id - b.id);
            renderMenu();
        });

        window.switchCategory = (cat) => {
            currentCategory = cat;
            document.getElementById('cat-makanan').classList.toggle('active', cat === 'makanan');
            document.getElementById('cat-minuman').classList.toggle('active', cat === 'minuman');
            renderMenu();
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            const filtered = menuData.filter(item => item.category === currentCategory);
            
            if(filtered.length === 0) { grid.innerHTML = `<p style="text-align:center; width:100%; color:var(--text-muted); font-size:11px;">Belum ada menu.</p>`; return; }

            grid.innerHTML = filtered.map(item => {
                const qty = cart[item.id] || 0;
                const isPersiapan = item.status === 'persiapan';
                let btn = '';

                if (isPersiapan) {
                    btn = `<button class="btn-add" disabled>Persiapan</button>`;
                } else {
                    btn = qty === 0 
                        ? `<button class="btn-add" onclick="addToCart(${item.id})">Tambah</button>` 
                        : `<div class="qty-control"><button onclick="updateQty(${item.id}, -1)">-</button><span>${qty}</span><button onclick="updateQty(${item.id}, 1)">+</button></div>`;
                }

                return `
                    <div class="menu-card">
                        <img src="${item.image}" class="menu-img" alt="${item.name}">
                        <div class="menu-title">${item.name}</div>
                        <div class="menu-price">Rp ${item.price.toLocaleString('id-ID')}</div>
                        ${btn}
                    </div>
                `;
            }).join('');
        }

        window.addToCart = (id) => { updateQty(id, 1); }
        window.updateQty = (id, change) => {
            if (!cart[id]) cart[id] = 0;
            cart[id] += change;
            if (cart[id] <= 0) delete cart[id];
            renderMenu();
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-list-popup');
            let html = '', total = 0, count = 0;

            Object.keys(cart).forEach(id => {
                const qty = cart[id];
                const item = menuData.find(i => i.id === parseInt(id));
                if (item) {
                    total += item.price * qty;
                    count += qty;
                    html += `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <div class="cart-item-name">${item.name}</div>
                                <div class="cart-item-price">${qty} x Rp ${item.price.toLocaleString('id-ID')}</div>
                            </div>
                            <div class="cart-item-total">Rp ${(item.price * qty).toLocaleString('id-ID')}</div>
                        </div>
                    `;
                }
            });

            if (html === '') html = `<p style="text-align: center; color: var(--text-muted); font-size: 11px;">Belum ada pesanan.</p>`;
            
            list.innerHTML = html;
            document.getElementById('cart-total-popup').innerText = `Rp ${total.toLocaleString('id-ID')}`;
            document.getElementById('floating-cart-count').innerText = count;
        }

        // BUKA POPUP KERANJANG
        window.openCartModal = () => {
            if (Object.keys(cart).length === 0) { alert("Pilih menu dulu ya!"); return; }
            document.getElementById('cart-modal').classList.add('show');
        }

        window.closeModal = (id) => { document.getElementById(id).classList.remove('show'); }

        window.openPaymentModal = () => {
            closeModal('cart-modal');
            document.getElementById('payment-modal').classList.add('show');
        }

        // Logika Generate Nomor Antrean
        function getQueueNumber() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + now.getMinutes().toString().padStart(2, '0');
            return `S-${timeStr}`;
        }

        async function simpanPesanan(metode, status) {
            const queueNum = getQueueNumber();
            let total = 0, rincian = [];
            
            Object.keys(cart).forEach(id => {
                const qty = cart[id];
                const item = menuData.find(i => i.id === parseInt(id));
                if (item) {
                    total += item.price * qty;
                    rincian.push({ nama: item.name, qty: qty, harga: item.price, id: item.id });
                }
            });

            const orderData = {
                order_id: 'SELF-' + Date.now(),
                queue_number: queueNum,
                waktu: new Date().toISOString(),
                rincian: rincian,
                total: total,
                metode: metode,
                status: status
            };

            const docRef = await addDoc(collection(db, "transaksi_selfservice"), orderData);
            return { queueNum, docRef: docRef.id, total, orderId: orderData.order_id };
        }

        // Skenario 1: Tunai
        window.prosesTunai = async () => {
            closeModal('payment-modal');
            try {
                const res = await simpanPesanan('Tunai', 'Menunggu Pembayaran Kasir');
                document.getElementById('success-title').innerText = "Pesanan Dibuat!";
                document.getElementById('success-desc').innerText = "Silakan bayar ke Kasir. Tunjukkan nomor antrean ini.";
                document.getElementById('display-queue').innerText = res.queueNum;
                document.getElementById('success-modal').classList.add('show');
            } catch (e) {
                alert("Gagal membuat pesanan: " + e.message);
            }
        }

        // Skenario 2: QRIS (Manual)
        window.prosesQRIS = () => {
            closeModal('payment-modal');
            let total = 0;
            Object.keys(cart).forEach(id => {
                const item = menuData.find(i => i.id === parseInt(id));
                if(item) total += item.price * cart[id];
            });
            document.getElementById('qris-total-display').innerText = `Rp ${total.toLocaleString('id-ID')}`;
            document.getElementById('qris-manual-modal').classList.add('show');
        }

        window.konfirmasiQRISManual = async () => {
            closeModal('qris-manual-modal');
            try {
                const res = await simpanPesanan('QRIS (Manual)', 'Menunggu Verifikasi Kasir');
                document.getElementById('success-title').innerText = "Pesanan Dibuat!";
                document.getElementById('success-desc').innerText = "Pembayaran diverifikasi oleh Kasir. Tunjukkan bukti transfer & nomor antrean.";
                document.getElementById('display-queue').innerText = res.queueNum;
                document.getElementById('success-modal').classList.add('show');
            } catch (e) {
                alert("Gagal membuat pesanan: " + e.message);
            }
        }

        window.kembaliKeAwal = () => {
            cart = {};
            document.getElementById('success-modal').classList.remove('show');
            renderMenu();
            renderCart();
            window.location.reload(); 
        }
    </script>
</body>
</html>
