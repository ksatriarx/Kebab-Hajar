<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pesan Mandiri - Kebab Turki Hajar</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Bangers&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-ccHdGHCTpj08BGVP"></script>
    <style>
        :root {
            --bg-main:#07070f; --bg-card:#12122a;
            --text-main:#fff; --text-muted:#9aa4c7;
            --primary:#ff1744; --primary-hover:#d50032;
            --accent:#ffd600; --success:#00e5ff; --cyan:#00e5ff;
            --border:#2b2b55; --radius-md:6px; --radius-lg:8px;
            --comic:'Bangers',cursive;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Nunito',sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:radial-gradient(circle at 12% -10%,rgba(255,23,68,.38),transparent 45%),radial-gradient(circle at 100% 110%,rgba(0,229,255,.24),transparent 45%),var(--bg-main); color:var(--text-main); display:flex; justify-content:center; min-height:100vh; overflow:hidden; }
        body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:0; background:radial-gradient(rgba(255,255,255,.09) 1.3px,transparent 1.8px) 0 0/14px 14px; -webkit-mask-image:linear-gradient(to bottom,#000,transparent 75%); mask-image:linear-gradient(to bottom,#000,transparent 75%); }
        body::after { content:''; position:fixed; inset:0; pointer-events:none; z-index:2000; background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px); opacity:.35; }
        ::-webkit-scrollbar { width:6px; height:6px; } ::-webkit-scrollbar-thumb { background:var(--primary); border-radius:3px; }

        .kiosk-container { position:relative; z-index:1; width:100%; max-width:100vw; height:100vh; display:flex; flex-direction:column; }

        /* HEADER */
        .header { position:relative; overflow:hidden; background:linear-gradient(100deg,#b0002a,var(--primary) 60%,#ff5a3c); padding:12px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:4px solid #000; box-shadow:0 5px 0 var(--cyan),0 10px 30px rgba(0,229,255,.35); z-index:10; }
        .header::before { content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(rgba(0,0,0,.3) 2px,transparent 2.6px) 0 0/10px 10px; -webkit-mask-image:linear-gradient(90deg,transparent 25%,#000); mask-image:linear-gradient(90deg,transparent 25%,#000); }
        .header h1 { position:relative; font-family:var(--comic); font-weight:400; font-size:32px; letter-spacing:2px; color:#fff; text-shadow:3px 3px 0 #000; -webkit-text-stroke:1px #000; display:flex; align-items:center; gap:10px; }
        .header h1 i { font-size:26px; filter:drop-shadow(2px 2px 0 #000); }
        .header h1 span { color:var(--accent); }
        .tag { position:relative; font-family:var(--comic); font-size:15px; letter-spacing:1.5px; color:#000; background:var(--cyan); border:3px solid #000; padding:3px 14px; transform:skew(-10deg); box-shadow:3px 3px 0 #000; }

        /* LAYOUT */
        .main-layout { display:flex; flex-grow:1; overflow:hidden; padding:18px 15px 15px; gap:18px; }
        .menu-area { flex:2; overflow-y:auto; padding:4px 8px 80px 4px; }
        .category-pills { display:flex; gap:14px; margin-bottom:18px; overflow-x:auto; scrollbar-width:none; padding:4px 8px 8px 4px; }
        .category-pills::-webkit-scrollbar { display:none; }
        .cat-pill { font-family:var(--comic); font-size:19px; letter-spacing:1.5px; background:#000; color:#fff; border:3px solid #fff; padding:6px 24px; border-radius:0; cursor:pointer; white-space:nowrap; transform:skew(-8deg); box-shadow:4px 4px 0 var(--primary); transition:.2s; }
        .cat-pill.active { background:var(--accent); color:#000; border-color:#000; box-shadow:4px 4px 0 #000,0 0 20px rgba(255,214,0,.65); }

        .menu-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:20px 18px; padding:4px 8px 8px 4px; }
        .menu-card { position:relative; background:linear-gradient(160deg,#1a1a3d,var(--bg-card)); border:3px solid #fff; border-radius:var(--radius-md); padding:8px; box-shadow:6px 6px 0 var(--primary); display:flex; flex-direction:column; transition:transform .2s,box-shadow .2s; }
        .menu-card::after { content:''; position:absolute; right:0; top:0; width:50px; height:50px; background:radial-gradient(var(--accent) 1.6px,transparent 2px) 0 0/7px 7px; clip-path:polygon(0 0,100% 0,100% 100%); opacity:.5; pointer-events:none; }
        @media (hover:hover) { .menu-card:hover { transform:translate(-3px,-3px) rotate(-.8deg); box-shadow:9px 9px 0 var(--cyan); } }
        .menu-card:active { transform:scale(.97); }
        .menu-img { width:100%; aspect-ratio:1/1; border-radius:3px; object-fit:cover; margin-bottom:8px; border:3px solid #000; filter:saturate(1.25) contrast(1.05); }
        .menu-title { font-size:13px; font-weight:800; margin-bottom:4px; line-height:1.3; color:#fff; }
        .menu-price { font-family:var(--comic); font-size:21px; letter-spacing:1px; color:var(--accent); text-shadow:2px 2px 0 #000; margin-bottom:10px; }
        .btn-add { font-family:var(--comic); font-size:17px; letter-spacing:1.5px; background:var(--primary); color:#fff; border:3px solid #000; width:100%; padding:7px; border-radius:3px; cursor:pointer; box-shadow:3px 3px 0 #000; transition:.12s; }
        .btn-add:active { transform:translate(3px,3px); box-shadow:0 0 0 #000; background:var(--primary-hover); }
        .btn-add:disabled { background:#3a3a55; color:var(--text-muted); box-shadow:none; cursor:not-allowed; font-size:14px; }
        .qty-control { display:flex; justify-content:space-between; align-items:center; background:#000; border:3px solid #fff; border-radius:3px; padding:3px; }
        .qty-control button { font-family:var(--comic); font-size:20px; background:var(--accent); color:#000; border:2px solid #000; width:30px; height:28px; border-radius:3px; cursor:pointer; line-height:1; }
        .qty-control button:active { transform:scale(.9); }
        .qty-control span { font-family:var(--comic); font-size:22px; color:#fff; letter-spacing:1px; }

        /* CART */
        .cart-area { flex:1; min-width:300px; max-width:350px; background:linear-gradient(180deg,#101030,#08081a); border:3px solid var(--cyan); border-radius:var(--radius-lg); box-shadow:0 0 0 3px #000,0 0 32px rgba(0,229,255,.35),8px 8px 0 #000; display:flex; flex-direction:column; }
        .cart-header { padding:14px 15px; border-bottom:2px dashed rgba(0,229,255,.55); background:linear-gradient(90deg,rgba(0,229,255,.18),transparent); display:flex; justify-content:space-between; align-items:center; }
        .cart-header h2 { font-family:var(--comic); font-weight:400; font-size:24px; letter-spacing:2px; color:var(--cyan); text-shadow:0 0 12px var(--cyan); }
        .cart-header button { color:#fff; }
        .cart-list { flex-grow:1; overflow-y:auto; padding:15px; }
        .cart-item { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding-bottom:12px; border-bottom:1px dashed var(--border); color:#fff; }
        .cart-item-info { flex-grow:1; }
        .cart-item-name { font-size:13px; font-weight:800; }
        .cart-item-price { font-size:12px; color:var(--text-muted); }
        .cart-footer { padding:15px; border-top:3px solid #000; background:#06060f; border-bottom-left-radius:5px; border-bottom-right-radius:5px; }
        .total-row { display:flex; justify-content:space-between; align-items:center; font-family:var(--comic); font-size:26px; letter-spacing:1.5px; color:var(--accent); text-shadow:2px 2px 0 #000; margin-bottom:14px; }
        .total-row span { font-family:var(--comic); }
        .btn-checkout { width:100%; font-family:var(--comic); font-size:23px; letter-spacing:2px; background:var(--accent); color:#000; border:3px solid #000; padding:12px; border-radius:4px; cursor:pointer; box-shadow:5px 5px 0 var(--primary); transition:.12s; }
        .btn-checkout:active { transform:translate(5px,5px); box-shadow:0 0 0 #000; }

        /* MODAL */
        .modal-overlay { position:fixed; inset:0; background:radial-gradient(rgba(255,23,68,.18) 2px,transparent 2.6px) 0 0/12px 12px,rgba(2,2,12,.82); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; }
        .modal-box { background:linear-gradient(160deg,#1a1a3d,var(--bg-card)); color:#fff; border:4px solid #fff; border-radius:var(--radius-md); width:100%; max-width:400px; padding:26px; text-align:center; box-shadow:10px 10px 0 var(--primary),0 0 40px rgba(0,229,255,.3); animation:popIn .35s cubic-bezier(.175,.885,.32,1.4); }
        @keyframes popIn { from { transform:scale(.5) rotate(-6deg); opacity:0; } to { transform:scale(1) rotate(0); opacity:1; } }
        .modal-box h3 { font-family:var(--comic); font-weight:400; font-size:32px; letter-spacing:2px; color:var(--accent); text-shadow:3px 3px 0 #000; margin-bottom:8px; }
        .modal-box p { color:var(--text-muted); font-size:14px; margin-bottom:22px; }
        .pay-options { display:flex; gap:14px; }
        .pay-btn { flex:1; padding:18px 10px; border-radius:4px; border:3px solid #fff; background:#000; color:#fff; cursor:pointer; transition:.15s; display:flex; flex-direction:column; align-items:center; gap:8px; }
        .pay-btn:hover { border-color:var(--cyan); background:rgba(0,229,255,.1); box-shadow:4px 4px 0 var(--cyan); transform:translate(-2px,-2px); }
        .pay-btn i { font-size:30px; color:#fff; }
        .pay-btn span { font-family:var(--comic); font-size:23px; letter-spacing:1.5px; }
        .pay-btn small { color:var(--text-muted); font-size:11px; }
        .btn-close-modal { margin-top:20px; background:transparent; border:none; color:var(--text-muted); font-family:var(--comic); font-size:17px; letter-spacing:1.5px; cursor:pointer; }
        #success-modal { z-index:1001; }
        .success-icon { width:80px; height:80px; background:var(--cyan); color:#000; border:4px solid #000; box-shadow:4px 4px 0 var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:40px; margin:0 auto 18px; }
        .queue-number { font-family:var(--comic); font-size:76px; letter-spacing:4px; color:var(--accent); text-shadow:4px 4px 0 var(--primary),0 0 26px rgba(255,214,0,.6); margin:10px 0; animation:pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 50% { transform:scale(1.06); } }

        /* RESPONSIVE (MODE HP) */
        @media (max-width:768px) {
            .header h1 { font-size:26px; }
            .main-layout { flex-direction:column; padding:0; gap:0; }
            .menu-area { padding:14px 12px 150px; }
            .menu-grid { grid-template-columns:repeat(2,1fr); }
            .cart-area { position:fixed; bottom:0; left:0; width:100%; max-width:100%; border-radius:16px 16px 0 0; max-height:50vh; transform:translateY(100%); transition:transform .3s; z-index:100; }
            .cart-area.show { transform:translateY(0); }
            .cart-header { padding:10px 15px; }
            .cart-header h2 { font-size:20px; }
            .cart-list { padding:10px 15px; max-height:200px; }
            .cart-footer { padding:10px 15px; }
            .btn-checkout { padding:10px; font-size:20px; }
            .floating-cart-btn { display:flex; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); font-family:var(--comic); font-size:20px; letter-spacing:1.5px; background:var(--accent); color:#000; padding:11px 24px; border:3px solid #000; border-radius:4px; box-shadow:5px 5px 0 var(--primary),0 0 24px rgba(255,214,0,.5); z-index:99; align-items:center; gap:10px; cursor:pointer; width:90%; justify-content:center; }
        }
        @media (min-width:769px) { .floating-cart-btn { display:none; } }
        @media (prefers-reduced-motion:reduce) { *,*::before { animation:none!important; transition:none!important; } }
    </style>
</head>
<body>

    <div class="kiosk-container">
        <div class="header">
            <h1><i class="fa-solid fa-spider"></i> Kebab <span>Hajar</span></h1>
            <div class="tag">SELF SERVICE</div>
        </div>

        <div class="main-layout">
            <!-- MENU -->
            <div class="menu-area">
                <div class="category-pills">
                    <button class="cat-pill active" onclick="switchCategory('makanan')" id="cat-makanan">Makanan</button>
                    <button class="cat-pill" onclick="switchCategory('minuman')" id="cat-minuman">Minuman</button>
                </div>
                <div class="menu-grid" id="menu-grid">
                    <!-- Diisi JS -->
                </div>
            </div>

            <!-- KERANJANG -->
            <div class="cart-area" id="cart-area">
                <div class="cart-header">
                    <h2>Pesanan Anda</h2>
                    <button onclick="toggleCart()" style="display: none; background:none; border:none; font-size: 20px;" id="btn-close-cart-mobile"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="cart-list" id="cart-list">
                    <p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 20px;">Belum ada pesanan.</p>
                </div>
                <div class="cart-footer">
                    <div class="total-row">
                        <span>Total:</span>
                        <span id="cart-total">Rp 0</span>
                    </div>
                    <button class="btn-checkout" onclick="openPaymentModal()">Lanjut Pembayaran</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tombol Keranjang untuk HP -->
    <button class="floating-cart-btn" onclick="toggleCart()" id="floating-cart-btn">
        <i class="fa-solid fa-cart-shopping"></i> Lihat Pesanan (<span id="floating-cart-count">0</span>)
    </button>

    <!-- MODAL PILIH PEMBAYARAN -->
    <div class="modal-overlay" id="payment-modal">
        <div class="modal-box">
            <h3>Pilih Pembayaran</h3>
            <p>Silakan pilih metode pembayaran Anda</p>
            
            <div class="pay-options">
                <button class="pay-btn" onclick="prosesTunai()">
                    <i class="fa-solid fa-money-bill-wave" style="color: var(--success);"></i>
                    <span>Tunai</span>
                    <small>Bayar di Kasir</small>
                </button>
                <button class="pay-btn" onclick="prosesQRIS()">
                    <i class="fa-solid fa-qrcode" style="color: var(--primary);"></i>
                    <span>QRIS</span>
                    <small>Scan & Bayar</small>
                </button>
            </div>
            
            <button class="btn-close-modal" onclick="closeModal('payment-modal')">Batal</button>
        </div>
    </div>

    <!-- MODAL SUKSES -->
    <div class="modal-overlay" id="success-modal">
        <div class="modal-box">
            <div class="success-icon"><i class="fa-solid fa-check"></i></div>
            <h3 id="success-title">Pesanan Dibuat!</h3>
            <p id="success-desc">Silakan tunjukkan nomor ini ke Kasir untuk melakukan pembayaran.</p>
            
            <div style="font-size: 14px; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Nomor Antrean</div>
            <div class="queue-number" id="display-queue">#00</div>
            
            <button class="btn-checkout" onclick="kembaliKeAwal()" style="margin-top: 20px;">Selesai</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCceiYONY_sx9ivD0CDDQGoB9OXm05h4CY", authDomain: "kebab-idi.firebaseapp.com", projectId: "kebab-idi", storageBucket: "kebab-idi.firebasestorage.app", messagingSenderId: "303997052314", appId: "1:303997052314:web:1db122bc5911297b710623" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let menuData = []; let cart = {}; let currentCategory = 'makanan'; let isCartOpen = false;

        // 1. Ambil Data Menu
        onSnapshot(collection(db, "menu_kebab"), (snapshot) => {
            menuData = [];
            snapshot.forEach((doc) => { menuData.push(doc.data()); });
            menuData.sort((a, b) => a.id - b.id);
            renderMenu();
        });

        window.switchCategory = (cat) => {
            currentCategory = cat;
            document.getElementById('cat-makanan').classList.toggle('active', cat === 'makanan');
            document.getElementById('cat-minuman').classList.toggle('active', cat === 'minuman');
            renderMenu();
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            const filtered = menuData.filter(item => item.category === currentCategory);
            
            if(filtered.length === 0) { grid.innerHTML = `<p style="text-align:center; width:100%; color:var(--text-muted);">Belum ada menu.</p>`; return; }

            grid.innerHTML = filtered.map(item => {
                const qty = cart[item.id] || 0;
                const isPersiapan = item.status === 'persiapan';
                let btn = '';

                if (isPersiapan) {
                    btn = `<button class="btn-add" disabled>Sedang Persiapan</button>`;
                } else {
                    btn = qty === 0 
                        ? `<button class="btn-add" onclick="addToCart(${item.id})">Tambah</button>` 
                        : `<div class="qty-control"><button onclick="updateQty(${item.id}, -1)">-</button><span>${qty}</span><button onclick="updateQty(${item.id}, 1)">+</button></div>`;
                }

                return `
                    <div class="menu-card">
                        <img src="${item.image}" class="menu-img" alt="${item.name}">
                        <div class="menu-title">${item.name}</div>
                        <div class="menu-price">Rp ${item.price.toLocaleString('id-ID')}</div>
                        ${btn}
                    </div>
                `;
            }).join('');
        }

        window.addToCart = (id) => { updateQty(id, 1); }
        window.updateQty = (id, change) => {
            if (!cart[id]) cart[id] = 0;
            cart[id] += change;
            if (cart[id] <= 0) delete cart[id];
            renderMenu();
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            let html = '', total = 0, count = 0;

            Object.keys(cart).forEach(id => {
                const qty = cart[id];
                const item = menuData.find(i => i.id === parseInt(id));
                if (item) {
                    total += item.price * qty;
                    count += qty;
                    html += `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <div class="cart-item-name">${item.name}</div>
                                <div class="cart-item-price">${qty} x Rp ${item.price.toLocaleString('id-ID')}</div>
                            </div>
                            <div style="font-weight: 800; font-size: 13px;">Rp ${(item.price * qty).toLocaleString('id-ID')}</div>
                        </div>
                    `;
                }
            });

            if (html === '') html = `<p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 20px;">Belum ada pesanan.</p>`;
            
            list.innerHTML = html;
            document.getElementById('cart-total').innerText = `Rp ${total.toLocaleString('id-ID')}`;
            document.getElementById('floating-cart-count').innerText = count;
        }

        window.toggleCart = () => {
            const cartArea = document.getElementById('cart-area');
            const btnClose = document.getElementById('btn-close-cart-mobile');
            isCartOpen = !isCartOpen;
            if (isCartOpen) {
                cartArea.classList.add('show');
                btnClose.style.display = 'block';
            } else {
                cartArea.classList.remove('show');
                btnClose.style.display = 'none';
            }
        }

        window.openPaymentModal = () => {
            if (Object.keys(cart).length === 0) { alert("Pilih menu dulu ya!"); return; }
            document.getElementById('payment-modal').style.display = 'flex';
        }

        window.closeModal = (id) => { document.getElementById(id).style.display = 'none'; }

        // Logika Generate Nomor Antrean (Sederhana & Cepat)
        function getQueueNumber() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + now.getMinutes().toString().padStart(2, '0');
            return `S-${timeStr}`; // Contoh: S-1430 (Self-service jam 14:30)
        }

        async function simpanPesanan(metode, status) {
            const queueNum = getQueueNumber();
            let total = 0, rincian = [];
            
            Object.keys(cart).forEach(id => {
                const qty = cart[id];
                const item = menuData.find(i => i.id === parseInt(id));
                if (item) {
                    total += item.price * qty;
                    rincian.push({ nama: item.name, qty: qty, harga: item.price, id: item.id });
                }
            });

            const orderData = {
                order_id: 'SELF-' + Date.now(),
                queue_number: queueNum,
                waktu: new Date().toISOString(),
                rincian: rincian,
                total: total,
                metode: metode,
                status: status
            };

            const docRef = await addDoc(collection(db, "transaksi_selfservice"), orderData);
            return { queueNum, docRef: docRef.id, total, orderId: orderData.order_id };
        }

        // Skenario 1: Tunai
        window.prosesTunai = async () => {
            closeModal('payment-modal');
            try {
                const res = await simpanPesanan('Tunai', 'Menunggu Pembayaran Kasir');
                document.getElementById('success-title').innerText = "Pesanan Dibuat!";
                document.getElementById('success-desc').innerText = "Silakan bayar ke Kasir. Tunjukkan nomor antrean ini.";
                document.getElementById('display-queue').innerText = res.queueNum;
                document.getElementById('success-modal').style.display = 'flex';
            } catch (e) {
                alert("Gagal membuat pesanan: " + e.message);
            }
        }

        // Skenario 2: QRIS (Midtrans)
        window.prosesQRIS = async () => {
            closeModal('payment-modal');
            try {
                // 1. Simpan pesanan sementara
                const res = await simpanPesanan('QRIS', 'Menunggu Pembayaran QRIS');
                
                // 2. Panggil Vercel untuk minta Token
                const response = await fetch('https://kebab-backend.vercel.app/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        order_id: res.orderId,
                        gross_amount: res.total,
                        nama_pembeli: "Pelanggan Self Service",
                        email_pembeli: "selfservice@kebabidi.com"
                    })
                });
                
                const data = await response.json();
                
                if (data.token) {
                    window.snap.pay(data.token, {
                        onSuccess: function(result){
                            // Karena webhook akan mengupdate status, kita langsung tampilkan sukses
                            document.getElementById('success-title').innerText = "Pembayaran Berhasil!";
                            document.getElementById('success-desc').innerText = "Terima kasih. Pesanan Anda sedang disiapkan.";
                            document.getElementById('display-queue').innerText = res.queueNum;
                            document.getElementById('success-modal').style.display = 'flex';
                        },
                        onPending: function(result){
                            alert("⏳ Menunggu pembayaran.");
                            kembaliKeAwal();
                        },
                        onError: function(result){
                            alert("❌ Pembayaran gagal.");
                            kembaliKeAwal();
                        }
                    });
                } else {
                    alert("Gagal memuat sistem pembayaran.");
                }
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        window.kembaliKeAwal = () => {
            cart = {};
            document.getElementById('success-modal').style.display = 'none';
            renderMenu();
            renderCart();
            if (isCartOpen) toggleCart();
            window.location.reload(); // Segarkan halaman agar bersih
        }
    </script>
</body>
</html>
